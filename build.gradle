plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'org.ajoberstar.grgit' version '5.2.0'
    // Central Portal publisher. `nmcp` is applied per publishing project (and by
    // julc-bom, which configures itself outside the subprojects block); the root
    // declares it here so those projects can apply it from the classpath.
    id 'com.gradleup.nmcp' version '1.6.2'
    id 'com.gradleup.nmcp.aggregation' version '1.6.2'
}

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

ext.ossrhUsername = System.getenv('MAVEN_USERNAME')
ext.ossrhPassword = System.getenv('MAVEN_PASSWORD')

// Central Portal publishing through the native publisher API (nmcp), replacing
// the legacy OSSRH staging API. `USER_MANAGED` uploads the deployment and stops
// at VALIDATED: nothing reaches Maven Central until a human publishes it, from
// the portal UI or through the approval-gated .github/workflows/publish-central.yml.
// Do not set `publishingTimeout` here -- nmcp rejects it under USER_MANAGED.
nmcpAggregation {
    centralPortal {
        username = ossrhUsername
        password = ossrhPassword
        publishingType = 'USER_MANAGED'
        // Names the pending deployment in the portal list. The deployment id
        // itself is assigned by the server and reported by the upload task.
        publicationName = "julc:${project.version}"
        // The aggregate carries every module, its sources and its javadoc; the
        // 10 minute default validation wait is tight for it.
        validationTimeout = java.time.Duration.ofMinutes(30)
    }
}

// Root project does not publish artifacts (subprojects + BOM handle this)

// Modules that are applications, test harnesses or aggregators rather than
// published libraries. Declared here, not inside `subprojects`, because the
// Central deployment scope below is derived from it.
def nonPublishable = ['julc-examples', 'julc-e2e-tests', 'julc-plugin-test', 'julc-analyzer-cli', 'julc-benchmark', 'julc-cli', 'julc-playground', 'julc-jrl']

subprojects {
    def commit_id = getCheckedOutGitCommitHash()
    if (project.version.endsWith("-SNAPSHOT")) {
        version = "${project.version}".replace("-SNAPSHOT", "-${commit_id}-SNAPSHOT")
    }

    // The BOM module uses java-platform, which is incompatible with java-library
    if (project.name == 'julc-bom') {
        return
    }

    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
//        options.compilerArgs.addAll(['--enable-preview'])
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
//        jvmArgs '--enable-preview'
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        maxHeapSize = '1g'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('-release', '25')
//        options.addBooleanOption('-enable-preview', true)
        options.addStringOption('Xdoclint:none', '-quiet')
        // JDK 21+ embeds ~3.9 MB of DejaVu web fonts in every javadoc output.
        // Across the published modules that is most of the Central deployment,
        // for a page style that falls back to system fonts without them.
        options.addBooleanOption('-no-fonts', true)
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
            showStandardStreams = true
        }
    }

    // Publishing for publishable modules
    if (!nonPublishable.contains(project.name)) {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'
        // Exposes this project's publications to the root nmcpAggregation.
        // Which of them actually reach Central is decided by the aggregation
        // dependencies below, not by this apply.
        apply plugin: 'com.gradleup.nmcp'

        java {
            withSourcesJar()
            withJavadocJar()
        }

        afterEvaluate {
            if (!plugins.hasPlugin('java-gradle-plugin')) {
                publishing {
                    publications {
                        mavenJava(MavenPublication) {
                            from components.java
                            artifactId project.name
                            pom {
                                url = 'https://github.com/bloxbean/julc'
                                licenses {
                                    license {
                                        name = 'The MIT License'
                                        url = 'https://opensource.org/licenses/mit-license.php'
                                    }
                                }
                                developers {
                                    developer {
                                        id = 'satran004'
                                        name = 'Satya'
                                    }
                                }
                                scm {
                                    connection = 'scm:git:git://github.com/bloxbean/julc.git'
                                    developerConnection = 'scm:git:ssh://git@github.com/bloxbean/julc.git'
                                    url = 'https://github.com/bloxbean/julc'
                                }
                            }
                        }
                    }

                }
            }
        }

        ext.isReleaseVersion = !version.endsWith("SNAPSHOT")
        if (isReleaseVersion && !project.hasProperty("skipSigning")) {
            signing {
                sign publishing.publications
            }
        }
    }
}

// The Maven Central deployment scope. Derived from the projects that own a
// publication rather than restated by hand, so it cannot drift from what the
// build actually publishes. `julc-bom` is included: it is not in
// `nonPublishable`, and it applies nmcp from its own build script because the
// subprojects block returns before reaching it. The root publishes nothing.
def centralDeploymentProjects = subprojects.findAll { candidate ->
    !(candidate.name in nonPublishable)
}

dependencies {
    centralDeploymentProjects.each { candidate ->
        nmcpAggregation(project(candidate.path))
    }
}

// A deployment that silently loses a module is worse than one that fails, so
// the resolved scope is asserted against the publications the build declares.
tasks.register('verifyMavenReleasePublicationScope') {
    group = 'verification'
    description = 'Asserts the Central deployment covers every Maven publication the build declares.'
    def expected = centralDeploymentProjects.collect { it.path }.toSet()
    doLast {
        def declared = allprojects.findAll { candidate ->
            candidate.pluginManager.hasPlugin('maven-publish') &&
                    !candidate.publishing.publications.withType(MavenPublication).isEmpty()
        }.collect { it.path }.toSet()
        def missing = declared - expected
        def extra = expected - declared
        if (!missing.isEmpty() || !extra.isEmpty()) {
            throw new GradleException(
                    'Central deployment scope does not match declared publications. ' +
                            "Publishing but not deployed: ${missing.sort()}; " +
                            "deployed but publishes nothing: ${extra.sort()}")
        }
    }
}

// The scope check must gate the work itself, not the lifecycle alias.
// `publishAggregationToCentralPortal` is an alias whose dependencies are
// unordered relative to each other, so hanging the check off it lets the upload
// run first. Attaching it to the zip -- which every portal task depends on --
// puts the check ahead of both the bundle and the network calls.
tasks.matching {
    it.name in ['nmcpZipAggregation',
                'nmcpPublishAggregationToCentralPortal',
                'nmcpPublishAggregationToCentralPortalSnapshots']
}.configureEach {
    dependsOn 'verifyMavenReleasePublicationScope'
}

def getCheckedOutGitCommitHash() {
    try {
        grgit.head().abbreviatedId
    } catch (Exception e) {
        // Fallback for git worktrees where grgit may not resolve properly
        'git rev-parse --short HEAD'.execute(null, project.rootDir).text.trim()
    }
}
