plugins {
    id 'java-library'
}

description = 'End-to-end integration tests against Yaci Devkit'

dependencies {
    testImplementation project(':julc-core')
    testImplementation project(':julc-compiler')
    testImplementation project(':julc-ledger-api')
    testImplementation project(':julc-stdlib')
    testImplementation project(':julc-testkit')
    testImplementation project(':julc-cardano-client-lib')
    testImplementation project(':julc-vm')
    testImplementation project(':julc-vm-java')
    testRuntimeOnly project(':julc-vm-scalus')

    testImplementation 'com.bloxbean.cardano:cardano-client-lib:0.7.1'
    testImplementation 'com.bloxbean.cardano:cardano-client-backend-blockfrost:0.7.1'
}

test {
    useJUnitPlatform {
        excludeTags 'list-case-onchain', 'switch-pair-case-onchain', 'native-constants-onchain', 'onchain-harness'
    }
    // E2E tests only run when explicitly enabled: ./gradlew :julc-e2e-tests:test -Pe2e
    enabled = System.getProperty('e2e') != null || project.hasProperty('e2e')
}

// Pure harness/fixture regressions are safe in the normal build (no node or subprocess).
tasks.register('onChainHarnessTest', Test) {
    group = 'verification'
    description = 'Offline launcher, native-constant hash and pinned-budget regressions'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'onchain-harness' }
}
tasks.named('check') { dependsOn tasks.named('onChainHarnessTest') }

// Direct Haskell access is explicit and may use an existing Docker OR native DevKit.
// Java validates the mutually exclusive launcher configuration before account funding.
[
    listCaseOnChainTest: ['list-case-onchain', 2],
    switchPairCaseOnChainTest: ['switch-pair-case-onchain', 2],
    nativeConstantsOnChainTest: ['native-constants-onchain', 12]
].each { taskName, gate ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "PV11 direct-Haskell release gate: ${gate[0]}"
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags gate[0] }
        testLogging {
            events 'passed', 'failed', 'skipped'
            showStandardStreams = true
        }
        afterSuite { descriptor, result ->
            if (descriptor.parent == null && (result.testCount < gate[1] || result.skippedTestCount > 0)) {
                throw new GradleException("${taskName} requires all ${gate[1]} cases without skips")
            }
        }
        // External chain/configuration is not a Gradle input; never reuse an old pass.
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        doFirst {
            if (!project.hasProperty('e2e') && System.getProperty('e2e') == null) {
                throw new GradleException('Explicitly enable the developer devnet test with -Pe2e')
            }
        }
    }
}
