plugins {
    id 'java-library'
}

description = 'Typed Java security properties and annotation processing for JuLC verification'

dependencies {
    api project(':julc-compiler')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation project(':julc-stdlib')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'JuLC Verification'
                description = 'Typed security-property annotations and processors for JuLC formal verification'
            }
        }
    }
}

// ADR-068 M6: the equivalence gate, what a tool gives against the frozen baseline of 068/m6-tools-baseline.tsv:
//   ./gradlew :<module>:adr068Tools -Padr068.tools.sources=<dir>[:<dir>...] -Padr068.tools.baseline=<dir> [-Padr068.tools.out=<dir>] --offline
test {
    useJUnitPlatform {
        excludeTags 'adr068-tools'
    }
}

tasks.register('adr068Tools', Test) {
    group = 'verification'
    description = 'ADR-068 M6: this module\'s tools against their frozen baseline on a corpus'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'adr068-tools'
    }
    def sources = providers.gradleProperty('adr068.tools.sources')
    if (sources.present) systemProperty 'adr068.tools.sources', sources.get()
    def toolsBaseline = providers.gradleProperty('adr068.tools.baseline')
    if (toolsBaseline.present) systemProperty 'adr068.tools.baseline', toolsBaseline.get()
    systemProperty 'adr068.tools.out', providers.gradleProperty('adr068.tools.out')
            .map { rootProject.file(it).absolutePath }.orElse(layout.buildDirectory.dir('adr068-tools').get().asFile.absolutePath).get()
    outputs.upToDateWhen { false }
}
tasks.named('adr068Tools').configure { maxHeapSize = '3g' }
