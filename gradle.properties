group = org.julclang
version = 0.1.0-pre18
# Release side effects of a v* tag, independent of the Maven Central deployment.
# A Central deployment is staged and still needs a human to publish it, but a
# GitHub release is public the moment the tag is pushed: it can be deleted, but
# it still notifies watchers, and the Homebrew formulas point at its assets.
# With this false a tag builds, tests, compiles native images and handles only
# the Maven artifacts as the two flags below say, so a release can be rehearsed
# end to end (with bloxbean_repo_publish = false too, without publishing
# anything). `false` is the fallback everywhere (${VAR:-false}), so a missing or
# unparseable property fails safe.
github_release = true

# Where a v* tag publishes the Maven artifacts (docs/12-bloxbean-maven-repository.md). Both are built and signed once,
# so with both true the same files go to both. A Central deployment is staged and still needs a human to publish it;
# the BloxBean repository (https://repo.bloxbean.org/maven/releases) is public, and permanent, the moment the release
# run uploads it. Turn Central off to release to the BloxBean repository only (e.g. Central's quota is exhausted).
maven_central_publish = true
bloxbean_repo_publish = true

jqwikVersion = 1.9.2
