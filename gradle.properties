group = org.julclang
version = 0.1.0-pre17-dev1
# Release side effects of a v* tag, independent of the Maven Central deployment.
# A Central deployment is staged and still needs a human to publish it, but a
# GitHub release is public the moment the tag is pushed: it can be deleted, but
# it still notifies watchers, and the Homebrew formulas point at its assets.
# With this false a tag builds, tests, compiles native images and stages a
# Maven Central deployment and does nothing else, so a release can be rehearsed
# end to end without publishing anything. `false` is the fallback everywhere
# (${VAR:-false}), so a missing or unparseable property fails safe.
github_release = false
jqwikVersion = 1.9.2
