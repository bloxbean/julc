name: Build & Test

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main, develop, release/* ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Set up Node.js for JavaScript codec tests
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

    - name: Build with Gradle
      run: ./gradlew build -PskipSigning=true --stacktrace

    # Fails the PR, not release day, when a module starts or stops publishing without the Central deployment
    # scope in build.gradle following it.
    - name: Verify Maven Central publication scope
      run: ./gradlew verifyMavenReleasePublicationScope -PskipSigning=true --stacktrace

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/build/reports/tests/'
        retention-days: 14
