name: Native Image (Dev)

# Builds what native-image-release.yml attaches to a GitHub release - the CLI and playground native images, the
# WebAssembly bundles and the shadow jars - as dist-* workflow artifacts. Manual, or called by
# bloxbean-snapshot-dist.yml, which publishes exactly these files as a snapshot distribution.
#
# Nothing here is published to npm (ADR-077 D8): the npm packages it packs and checks are snapshot builds, and only
# native-image-release.yml's npm-publish job, on a release tag, publishes. This workflow has no id-token permission
# and uses no environment.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-aarch64
            binary: julc
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc
          - os: windows-latest
            label: windows-x86_64
            binary: julc.exe

    runs-on: ${{ matrix.os }}
    name: Build CLI ${{ matrix.label }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        # A snapshot carries the short commit id, like the version build.gradle gives the published modules.
        if [[ "$VERSION" == *-SNAPSHOT ]]; then
          VERSION="${VERSION%-SNAPSHOT}-${GITHUB_SHA::7}-SNAPSHOT"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

    - name: Build native image
      run: ./gradlew :julc-cli:nativeCompile -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        LABEL: ${{ matrix.label }}
        BINARY: ${{ matrix.binary }}
      run: |
        set -euo pipefail
        STAGING="julc-${VERSION}-${LABEL}"
        mkdir -p "$STAGING"
        cp "julc-cli/build/native/nativeCompile/${BINARY}" "$STAGING/"
        cp julc-cli/README.md "$STAGING/"
        zip -r "julc-${VERSION}-${LABEL}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
        LABEL: ${{ matrix.label }}
        BINARY: ${{ matrix.binary }}
      run: |
        $STAGING = "julc-$env:VERSION-$env:LABEL"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-cli/build/native/nativeCompile/$env:BINARY" -Destination $STAGING
        Copy-Item "julc-cli/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-$env:VERSION-$env:LABEL.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-cli-${{ matrix.label }}
        path: julc-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip
        retention-days: 3


  # The browser engine (julc-tools compiled to WebAssembly, ADR-054) is platform-independent, so it is
  # built and verified once here and reused everywhere: the playground native images bundle it, the bundles are
  # uploaded as workflow artifacts (native-image-release.yml attaches the same bundles to the GitHub release).
  wasm:
    runs-on: ubuntu-22.04
    name: Build JuLC WebAssembly distributions

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        # A snapshot carries the short commit id, like the version build.gradle gives the published modules.
        if [[ "$VERSION" == *-SNAPSHOT ]]; then
          VERSION="${VERSION%-SNAPSHOT}-${GITHUB_SHA::7}-SNAPSHOT"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # Web Image ships with the GraalVM 25.3 innovation release. Only graalvm/setup-graalvm resolves that line
    # (actions/setup-java only sees the 25.0 LTS line); it exports GRAALVM_HOME, which the Gradle build reads.
    # JAVA_HOME stays on the Temurin JDK below, so Gradle itself runs on the same JDK as the main build.
    - name: Set up GraalVM 25.3 (Web Image)
      uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
      with:
        version: '25.3'
        distribution: 'graalvm'
        set-java-home: 'false'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

    # Pinned by SHA-256, the release's own .sha256 asset; the same version and hash as native-image-release.yml.
    - name: Install Binaryen
      shell: bash
      env:
        BINARYEN_VERSION: '132'
        BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
      run: |
        set -euo pipefail
        f="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
        curl -sSfL -o "$RUNNER_TEMP/$f" \
          "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$f"
        echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
        tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

    # ADR-077 M1: @julclang/wasm-client is also loaded, from its packed tarball, by Node.js 22.3.0 (the lowest version
    # it supports) and Node.js 24, each checked against nodejs.org's SHASUMS256.txt.
    - name: Install Node.js 22.3.0 and 24 for the package smoke
      shell: bash
      run: |
        set -euo pipefail
        # The official linux-x64 archives, pinned by their SHA-256 (nodejs.org's SHASUMS256.txt for each release).
        cat > "$RUNNER_TEMP/node-sums.txt" <<'SUMS'
        33429139d4c4416439bf023b2eb2dc257da188fd793b64f21c8c03a0f04a5840  node-v22.3.0-linux-x64.tar.xz
        4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb  node-v24.22.3-linux-x64.tar.xz
        SUMS
        cd "$RUNNER_TEMP"
        nodes=()
        for version in v22.3.0 v24.22.3; do
          archive="node-${version}-linux-x64.tar.xz"
          curl -sSfLO "https://nodejs.org/dist/${version}/${archive}"
          grep " ${archive}\$" node-sums.txt | sed 's/^ *//' | sha256sum -c -
          tar -xJf "${archive}"
          nodes+=("$RUNNER_TEMP/node-${version}-linux-x64/bin/node")
        done
        echo "WASM_SMOKE_NODES=$(IFS=,; echo "${nodes[*]}")" >> "$GITHUB_ENV"

    # ADR-077 M1: Chromium for the CSP and cached-upgrade checks (wasmBrowserSmoke).
    - name: Install Playwright with Chromium
      shell: bash
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-audit --no-fund playwright@1.64.1
        "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
        echo "PLAYWRIGHT_DIR=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"

    # Builds the engine (build/wasm-bundle, also copied to frontend/public/wasm) and checks the parity fixtures
    # against the JVM in Node.js. A mismatch fails the release. It also checks @julclang/wasm-client (ADR-077 M1):
    # loading from its tarball in Node.js, in Chromium under a strict Content Security Policy, and its declarations.
    # And the engine packages (ADR-077 M3): I1 against the archives, their declarations, and the fixtures that
    # native-image-release.yml's wasm-package-checks runs, plus next build --webpack and Vite 7's development server,
    # which the release leaves out to stay short (the locked bundlers come from the npm registry; next dev stays local).
    - name: Build and verify engine
      run: >-
        ./gradlew :julc-wasm:wasmSmoke :julc-wasm:wasmBrowserSmoke :julc-wasm:wasmClientTypes
        :julc-wasm:wasmEngineTypes :julc-wasm:wasmEngineFixtures
        -PengineFixtures=node,plain,vite,webpack,webpack-keep,extension,webpack-node,esbuild,next,next-webpack,vite7-dev
        "-PwasmSmokeNodes=$WASM_SMOKE_NODES" "-PplaywrightDir=$PLAYWRIGHT_DIR"
        -PskipSigning=true --no-daemon --stacktrace
      shell: bash

    - name: Build static playground
      shell: bash
      run: |
        cd julc-playground/frontend
        npm ci
        npm run build:static

    - name: Package
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        echo "Engine version: $(jq -r .version julc-wasm/build/wasm-bundle-full/engine.json)"
        # Engine only: launcher, module and engine.json under content-addressed names.
        tar czf "julc-wasm-${VERSION}.tar.gz" -C julc-wasm/build/wasm-bundle-full .
        tar czf "julc-vm-wasm-${VERSION}.tar.gz" -C julc-wasm/build/wasm-bundle-vm .
        # Complete static playground (frontend + engine, relative paths): serve it from any path, no backend needed.
        tar czf "julc-playground-static-${VERSION}.tar.gz" -C julc-playground/frontend/dist-static .
        sha256sum "julc-wasm-${VERSION}.tar.gz" "julc-vm-wasm-${VERSION}.tar.gz" "julc-playground-static-${VERSION}.tar.gz" \
          > "julc-wasm-${VERSION}-SHA256SUMS.txt"
        cat "julc-wasm-${VERSION}-SHA256SUMS.txt"
        wc -c julc-wasm/build/wasm-bundle-{full,vm}/*.wasm >> "$GITHUB_STEP_SUMMARY"

    # Picked up by the native-image-playground jobs on every platform, so none of them needs Web Image.
    - name: Upload engine artifact
      uses: actions/upload-artifact@v4
      with:
        name: julc-wasm-full
        path: julc-wasm/build/wasm-bundle-full/
        if-no-files-found: error

    - name: Upload release-style bundles
      uses: actions/upload-artifact@v4
      with:
        name: dist-wasm
        path: |
          julc-wasm-${{ steps.version.outputs.version }}.tar.gz
          julc-vm-wasm-${{ steps.version.outputs.version }}.tar.gz
          julc-playground-static-${{ steps.version.outputs.version }}.tar.gz
          julc-wasm-${{ steps.version.outputs.version }}-SHA256SUMS.txt
        if-no-files-found: error

  native-image-playground:
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-aarch64
            binary: julc-playground
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc-playground
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc-playground
          - os: windows-latest
            label: windows-x86_64
            binary: julc-playground.exe

    runs-on: ${{ matrix.os }}
    name: Build Playground ${{ matrix.label }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        # A snapshot carries the short commit id, like the version build.gradle gives the published modules.
        if [[ "$VERSION" == *-SNAPSHOT ]]; then
          VERSION="${VERSION%-SNAPSHOT}-${GITHUB_SHA::7}-SNAPSHOT"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

    # The frontend build copies public/wasm into the static resources, so every server binary serves the browser
    # engine at /wasm/ without building Web Image on this platform.
    - name: Add browser engine to the frontend
      uses: actions/download-artifact@v4
      with:
        name: julc-wasm-full
        path: julc-playground/frontend/public/wasm

    - name: Build native image
      run: ./gradlew :julc-playground:nativeCompile -PwithFrontend -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        LABEL: ${{ matrix.label }}
        BINARY: ${{ matrix.binary }}
      run: |
        set -euo pipefail
        STAGING="julc-playground-${VERSION}-${LABEL}"
        mkdir -p "$STAGING"
        cp "julc-playground/build/native/nativeCompile/${BINARY}" "$STAGING/"
        cp julc-playground/README.md "$STAGING/"
        zip -r "julc-playground-${VERSION}-${LABEL}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
        LABEL: ${{ matrix.label }}
        BINARY: ${{ matrix.binary }}
      run: |
        $STAGING = "julc-playground-$env:VERSION-$env:LABEL"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-playground/build/native/nativeCompile/$env:BINARY" -Destination $STAGING
        Copy-Item "julc-playground/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-playground-$env:VERSION-$env:LABEL.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-playground-${{ matrix.label }}
        path: julc-playground-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip
        retention-days: 3

  shadow-jars:
    runs-on: ubuntu-latest
    name: Build Shadow JARs

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Build shadow JARs
      run: ./gradlew :julc-compiler:shadowJar :julc-vm-java:shadowJar -PskipSigning=true --no-daemon

    # Flattened into one directory, like native-image-release.yml, so the artifact holds the files, not their
    # build paths.
    - name: Collect the jars
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p shadow-dist
        cp julc-compiler/build/libs/julc-compiler-all-*-all.jar \
          julc-vm-java/build/libs/julc-vm-java-all-*-all.jar shadow-dist/
        ls -la shadow-dist

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-shadow-jars
        path: shadow-dist/*.jar
        if-no-files-found: error
        retention-days: 3
