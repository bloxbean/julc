name: Native Image (Dev)

# Builds what native-image-release.yml attaches to a GitHub release - the CLI and playground native images, the
# WebAssembly bundles and the shadow jars - as dist-* workflow artifacts. Manual, or called by
# bloxbean-snapshot-dist.yml, which publishes exactly these files as a snapshot distribution.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-aarch64
            binary: julc
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc
          - os: windows-latest
            label: windows-x86_64
            binary: julc.exe

    runs-on: ${{ matrix.os }}
    name: Build CLI ${{ matrix.label }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        # A snapshot carries the short commit id, like the version build.gradle gives the published modules.
        if [[ "$VERSION" == *-SNAPSHOT ]]; then
          VERSION="${VERSION%-SNAPSHOT}-${GITHUB_SHA::7}-SNAPSHOT"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

    - name: Build native image
      run: ./gradlew :julc-cli:nativeCompile -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        LABEL: ${{ matrix.label }}
        BINARY: ${{ matrix.binary }}
      run: |
        set -euo pipefail
        STAGING="julc-${VERSION}-${LABEL}"
        mkdir -p "$STAGING"
        cp "julc-cli/build/native/nativeCompile/${BINARY}" "$STAGING/"
        cp julc-cli/README.md "$STAGING/"
        zip -r "julc-${VERSION}-${LABEL}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
        LABEL: ${{ matrix.label }}
        BINARY: ${{ matrix.binary }}
      run: |
        $STAGING = "julc-$env:VERSION-$env:LABEL"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-cli/build/native/nativeCompile/$env:BINARY" -Destination $STAGING
        Copy-Item "julc-cli/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-$env:VERSION-$env:LABEL.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-cli-${{ matrix.label }}
        path: julc-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip
        retention-days: 3


  # The browser engine (julc-tools compiled to WebAssembly, ADR-054) is platform-independent, so it is
  # built and verified once here and reused everywhere: the playground native images bundle it, the bundles are
  # uploaded as workflow artifacts (native-image-release.yml attaches the same bundles to the GitHub release).
  wasm:
    runs-on: ubuntu-22.04
    name: Build JuLC WebAssembly distributions

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        # A snapshot carries the short commit id, like the version build.gradle gives the published modules.
        if [[ "$VERSION" == *-SNAPSHOT ]]; then
          VERSION="${VERSION%-SNAPSHOT}-${GITHUB_SHA::7}-SNAPSHOT"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # Web Image ships with the GraalVM 25.3 innovation release. Only graalvm/setup-graalvm resolves that line
    # (actions/setup-java only sees the 25.0 LTS line); it exports GRAALVM_HOME, which the Gradle build reads.
    # JAVA_HOME stays on the Temurin JDK below, so Gradle itself runs on the same JDK as the main build.
    - name: Set up GraalVM 25.3 (Web Image)
      uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
      with:
        version: '25.3'
        distribution: 'graalvm'
        set-java-home: 'false'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

    - name: Install Binaryen
      shell: bash
      run: |
        curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
          | tar xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"

    # Builds the engine (build/wasm-bundle, also copied to frontend/public/wasm) and checks the parity fixtures
    # against the JVM in Node.js. A mismatch fails the release.
    - name: Build and verify engine
      run: ./gradlew :julc-wasm:wasmSmoke -PskipSigning=true --no-daemon --stacktrace
      shell: bash

    - name: Build static playground
      shell: bash
      run: |
        cd julc-playground/frontend
        npm ci
        npm run build:static

    - name: Package
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        echo "Engine version: $(jq -r .version julc-wasm/build/wasm-bundle-full/engine.json)"
        # Engine only: launcher, module and engine.json under content-addressed names.
        tar czf "julc-wasm-${VERSION}.tar.gz" -C julc-wasm/build/wasm-bundle-full .
        tar czf "julc-vm-wasm-${VERSION}.tar.gz" -C julc-wasm/build/wasm-bundle-vm .
        # Complete static playground (frontend + engine, relative paths): serve it from any path, no backend needed.
        tar czf "julc-playground-static-${VERSION}.tar.gz" -C julc-playground/frontend/dist-static .
        sha256sum "julc-wasm-${VERSION}.tar.gz" "julc-vm-wasm-${VERSION}.tar.gz" "julc-playground-static-${VERSION}.tar.gz" \
          > "julc-wasm-${VERSION}-SHA256SUMS.txt"
        cat "julc-wasm-${VERSION}-SHA256SUMS.txt"
        wc -c julc-wasm/build/wasm-bundle-{full,vm}/*.wasm >> "$GITHUB_STEP_SUMMARY"

    # Picked up by the native-image-playground jobs on every platform, so none of them needs Web Image.
    - name: Upload engine artifact
      uses: actions/upload-artifact@v4
      with:
        name: julc-wasm-full
        path: julc-wasm/build/wasm-bundle-full/
        if-no-files-found: error

    - name: Upload release-style bundles
      uses: actions/upload-artifact@v4
      with:
        name: dist-wasm
        path: |
          julc-wasm-${{ steps.version.outputs.version }}.tar.gz
          julc-vm-wasm-${{ steps.version.outputs.version }}.tar.gz
          julc-playground-static-${{ steps.version.outputs.version }}.tar.gz
          julc-wasm-${{ steps.version.outputs.version }}-SHA256SUMS.txt
        if-no-files-found: error

  native-image-playground:
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-aarch64
            binary: julc-playground
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc-playground
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc-playground
          - os: windows-latest
            label: windows-x86_64
            binary: julc-playground.exe

    runs-on: ${{ matrix.os }}
    name: Build Playground ${{ matrix.label }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        # A snapshot carries the short commit id, like the version build.gradle gives the published modules.
        if [[ "$VERSION" == *-SNAPSHOT ]]; then
          VERSION="${VERSION%-SNAPSHOT}-${GITHUB_SHA::7}-SNAPSHOT"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

    # The frontend build copies public/wasm into the static resources, so every server binary serves the browser
    # engine at /wasm/ without building Web Image on this platform.
    - name: Add browser engine to the frontend
      uses: actions/download-artifact@v4
      with:
        name: julc-wasm-full
        path: julc-playground/frontend/public/wasm

    - name: Build native image
      run: ./gradlew :julc-playground:nativeCompile -PwithFrontend -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        LABEL: ${{ matrix.label }}
        BINARY: ${{ matrix.binary }}
      run: |
        set -euo pipefail
        STAGING="julc-playground-${VERSION}-${LABEL}"
        mkdir -p "$STAGING"
        cp "julc-playground/build/native/nativeCompile/${BINARY}" "$STAGING/"
        cp julc-playground/README.md "$STAGING/"
        zip -r "julc-playground-${VERSION}-${LABEL}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
        LABEL: ${{ matrix.label }}
        BINARY: ${{ matrix.binary }}
      run: |
        $STAGING = "julc-playground-$env:VERSION-$env:LABEL"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-playground/build/native/nativeCompile/$env:BINARY" -Destination $STAGING
        Copy-Item "julc-playground/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-playground-$env:VERSION-$env:LABEL.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-playground-${{ matrix.label }}
        path: julc-playground-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip
        retention-days: 3

  shadow-jars:
    runs-on: ubuntu-latest
    name: Build Shadow JARs

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Build shadow JARs
      run: ./gradlew :julc-compiler:shadowJar :julc-vm-java:shadowJar -PskipSigning=true --no-daemon

    # Flattened into one directory, like native-image-release.yml, so the artifact holds the files, not their
    # build paths.
    - name: Collect the jars
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p shadow-dist
        cp julc-compiler/build/libs/julc-compiler-all-*-all.jar \
          julc-vm-java/build/libs/julc-vm-java-all-*-all.jar shadow-dist/
        ls -la shadow-dist

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-shadow-jars
        path: shadow-dist/*.jar
        if-no-files-found: error
        retention-days: 3
