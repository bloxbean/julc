name: Native Image (Dev)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  native-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-aarch64
            binary: julc
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc
          - os: windows-latest
            label: windows-x86_64
            binary: julc.exe

    runs-on: ${{ matrix.os }}
    name: Build CLI ${{ matrix.label }}

    steps:
    - uses: actions/checkout@v4

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build native image
      run: ./gradlew :julc-cli:nativeCompile -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        STAGING="julc-${VERSION}-${{ matrix.label }}"
        mkdir -p "$STAGING"
        cp julc-cli/build/native/nativeCompile/${{ matrix.binary }} "$STAGING/"
        cp julc-cli/README.md "$STAGING/"
        zip -r "julc-${VERSION}-${{ matrix.label }}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $VERSION = "${{ steps.version.outputs.version }}"
        $STAGING = "julc-${VERSION}-${{ matrix.label }}"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-cli/build/native/nativeCompile/${{ matrix.binary }}" -Destination $STAGING
        Copy-Item "julc-cli/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-${VERSION}-${{ matrix.label }}.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: julc-${{ steps.version.outputs.version }}-${{ matrix.label }}
        path: julc-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip
        retention-days: 3


  # The browser engine (julc-playground-core compiled to WebAssembly, ADR-054) is platform-independent, so it is
  # built and verified once here and reused everywhere: the playground native images bundle it, the bundles are
  # uploaded as workflow artifacts (native-image-release.yml attaches the same bundles to the GitHub release).
  playground-wasm:
    runs-on: ubuntu-22.04
    name: Build Playground WebAssembly engine

    steps:
    - uses: actions/checkout@v4

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # Web Image ships with the GraalVM 25.3 innovation release. Only graalvm/setup-graalvm resolves that line
    # (actions/setup-java only sees the 25.0 LTS line); it exports GRAALVM_HOME, which the Gradle build reads.
    # JAVA_HOME stays on the Temurin JDK below, so Gradle itself runs on the same JDK as the main build.
    - name: Set up GraalVM 25.3 (Web Image)
      uses: graalvm/setup-graalvm@v1
      with:
        version: '25.3'
        distribution: 'graalvm'
        set-java-home: 'false'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Install Binaryen
      shell: bash
      run: |
        curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
          | tar xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"

    # Builds the engine (build/wasm-bundle, also copied to frontend/public/wasm) and checks the parity fixtures
    # against the JVM in Node.js. A mismatch fails the release.
    - name: Build and verify engine
      run: ./gradlew :julc-playground-wasm:wasmSmoke -PskipSigning=true --no-daemon --stacktrace
      shell: bash

    - name: Build static playground
      shell: bash
      run: |
        cd julc-playground/frontend
        npm ci
        npm run build:static

    - name: Package
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        echo "Engine version: $(jq -r .version julc-playground-wasm/build/wasm-bundle/engine.json)"
        # Engine only: launcher, module and engine.json under content-addressed names.
        tar czf "julc-playground-engine-${VERSION}.tar.gz" -C julc-playground-wasm/build/wasm-bundle .
        # Complete static playground (frontend + engine, relative paths): serve it from any path, no backend needed.
        tar czf "julc-playground-static-${VERSION}.tar.gz" -C julc-playground/frontend/dist-static .
        sha256sum "julc-playground-engine-${VERSION}.tar.gz" "julc-playground-static-${VERSION}.tar.gz" \
          > "julc-playground-wasm-${VERSION}-SHA256SUMS.txt"
        cat "julc-playground-wasm-${VERSION}-SHA256SUMS.txt"

    # Picked up by the native-image-playground jobs on every platform, so none of them needs Web Image.
    - name: Upload engine artifact
      uses: actions/upload-artifact@v4
      with:
        name: julc-playground-engine
        path: julc-playground-wasm/build/wasm-bundle/
        if-no-files-found: error

    - name: Upload release-style bundles
      uses: actions/upload-artifact@v4
      with:
        name: julc-playground-wasm-${{ steps.version.outputs.version }}
        path: |
          julc-playground-engine-${{ steps.version.outputs.version }}.tar.gz
          julc-playground-static-${{ steps.version.outputs.version }}.tar.gz
          julc-playground-wasm-${{ steps.version.outputs.version }}-SHA256SUMS.txt
        if-no-files-found: error

  native-image-playground:
    needs: playground-wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-aarch64
            binary: julc-playground
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc-playground
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc-playground
          - os: windows-latest
            label: windows-x86_64
            binary: julc-playground.exe

    runs-on: ${{ matrix.os }}
    name: Build Playground ${{ matrix.label }}

    steps:
    - uses: actions/checkout@v4

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep '^version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # The frontend build copies public/wasm into the static resources, so every server binary serves the browser
    # engine at /wasm/ without building Web Image on this platform.
    - name: Add browser engine to the frontend
      uses: actions/download-artifact@v4
      with:
        name: julc-playground-engine
        path: julc-playground/frontend/public/wasm

    - name: Build native image
      run: ./gradlew :julc-playground:nativeCompile -PwithFrontend -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        STAGING="julc-playground-${VERSION}-${{ matrix.label }}"
        mkdir -p "$STAGING"
        cp julc-playground/build/native/nativeCompile/${{ matrix.binary }} "$STAGING/"
        cp julc-playground/README.md "$STAGING/"
        zip -r "julc-playground-${VERSION}-${{ matrix.label }}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $VERSION = "${{ steps.version.outputs.version }}"
        $STAGING = "julc-playground-${VERSION}-${{ matrix.label }}"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-playground/build/native/nativeCompile/${{ matrix.binary }}" -Destination $STAGING
        Copy-Item "julc-playground/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-playground-${VERSION}-${{ matrix.label }}.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: julc-playground-${{ steps.version.outputs.version }}-${{ matrix.label }}
        path: julc-playground-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip
        retention-days: 3
