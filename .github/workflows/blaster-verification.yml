name: Blaster Verification

on:
  push:
    paths:
      - 'verification/blaster/**'
      - 'adr/verification/**'
      - 'julc-*/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/blaster-verification.yml'
  pull_request:
    paths:
      - 'verification/blaster/**'
      - 'adr/verification/**'
      - 'julc-*/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/blaster-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          lake-package-directory: verification/blaster

      - name: Acquire pinned dependencies
        run: verification/blaster/scripts/acquire-dependencies.sh

      - name: Produce evidence without dependency downloads
        run: verification/blaster/scripts/verify-offline.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blaster-verification-evidence
          path: |
            verification/blaster/generated/run-manifest.json
            verification/blaster/results/*.log
          if-no-files-found: error
          retention-days: 30
