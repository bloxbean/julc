name: Blaster Verification

on:
  push:
    paths:
      - 'verification/blaster/**'
      - 'adr/verification/**'
      - 'julc-*/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/blaster-verification.yml'
  pull_request:
    paths:
      - 'verification/blaster/**'
      - 'adr/verification/**'
      - 'julc-*/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/blaster-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          lake-package-directory: verification/blaster

      - name: Build JuLC verification runner
        run: ./gradlew :julc-cli:shadowJar -PskipSigning=true

      - name: Produce managed verification evidence
        run: java -jar julc-cli/build/libs/julc.jar verify run verification/blaster --backend local

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blaster-verification-evidence
          path: |
            verification/blaster/generated/run-manifest.json
            verification/blaster/results/*.log
            verification/blaster/verification-result.json
            verification/blaster/verification-results/*.log
          if-no-files-found: error
          retention-days: 30
