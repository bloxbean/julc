name: Blaster Verification

on:
  push:
    paths:
      - 'verification/blaster/**'
      - 'adr/verification/**'
      - 'julc-*/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/blaster-verification.yml'
  pull_request:
    paths:
      - 'verification/blaster/**'
      - 'adr/verification/**'
      - 'julc-*/**'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/blaster-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          lake-package-directory: verification/blaster

      - name: Acquire pinned dependencies
        run: verification/blaster/scripts/acquire-dependencies.sh

      - name: Produce evidence without dependency downloads
        run: verification/blaster/scripts/verify-offline.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blaster-verification-evidence
          path: |
            verification/blaster/generated/run-manifest.json
            verification/blaster/results/*.log
          if-no-files-found: error
          retention-days: 30
