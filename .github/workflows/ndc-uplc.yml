name: Node-diversity UPLC scenarios

# The Cardano node-diversity UPLC scenarios (https://github.com/pragma-org/node-diversity-conformance) on the Java VM.
#
#   uplc-conformance  gates releases: release.yml and native-image-release.yml call this workflow, and neither publishes
#                     anything unless it passes. Its corpus is vendored (julc-vm-java/src/test/resources/ndc/
#                     uplc-conformance), so it needs no network; `./gradlew build` (build.yml) runs it too. This job
#                     also runs on pull requests and pushes that touch the VM or the UPLC core, and on demand.
#   uplc-turbo        a performance report, on demand only (Run workflow, with "Run uplc-turbo" checked). It downloads
#                     its pinned corpus (julc-vm-java's NdcCorpus). It never gates anything; the job fails only if a
#                     script does not decode or evaluate, or consumes a budget other than cardano-node's. Timings from
#                     a shared runner are noisy: compare them with care. Its downloads are kept with actions/cache,
#                     which only saves downloading: every cached file's SHA-256 is checked before use.
#
# The reports (JSON in the scenario's format, and a text summary) are uploaded as artifacts. No secrets are used.

on:
  pull_request:
    branches: [ main, develop, release/* ]
    paths:
      - 'julc-core/**'
      - 'julc-vm/**'
      - 'julc-vm-java/**'
      - 'julc-bls/**'
      - '.github/workflows/ndc-uplc.yml'
  push:
    branches: [ main ]
    paths:
      - 'julc-core/**'
      - 'julc-vm/**'
      - 'julc-vm-java/**'
      - 'julc-bls/**'
      - '.github/workflows/ndc-uplc.yml'
  workflow_dispatch:
    inputs:
      turbo:
        description: 'Run uplc-turbo (the performance report) as well'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  uplc-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run uplc-conformance
        run: ./gradlew :julc-vm-java:ndcUplcConformance -PskipSigning=true --stacktrace

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ -f julc-vm-java/build/reports/ndc/uplc-conformance-summary.txt ]]; then
            { echo '```'; cat julc-vm-java/build/reports/ndc/uplc-conformance-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndc-uplc-conformance
          path: julc-vm-java/build/reports/ndc/
          retention-days: 30
          if-no-files-found: warn

  uplc-turbo:
    if: github.event_name == 'workflow_dispatch' && inputs.turbo
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The pinned downloads, keyed by the file that pins them. The harness checks every cached file's SHA-256 before
      # use, so a stale or damaged cache is downloaded again, never trusted.
      - name: Cache the pinned corpora
        uses: actions/cache@v4
        with:
          path: ~/.cache/julc-ndc
          key: ndc-corpora-${{ hashFiles('julc-vm-java/src/test/java/org/julclang/vm/java/ndc/NdcCorpus.java') }}

      - name: Run uplc-turbo
        run: ./gradlew :julc-vm-java:ndcUplcTurbo -PndcCacheDir="$HOME/.cache/julc-ndc" -PskipSigning=true --stacktrace

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ -f julc-vm-java/build/reports/ndc/uplc-turbo-summary.txt ]]; then
            { echo '```'; cat julc-vm-java/build/reports/ndc/uplc-turbo-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndc-uplc-turbo
          path: julc-vm-java/build/reports/ndc/
          retention-days: 30
          if-no-files-found: warn
