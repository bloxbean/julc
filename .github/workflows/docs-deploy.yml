name: Deploy Docs to GitHub Pages

on:
  push:
    tags:
      - 'dv*'

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout examples corpus
        uses: actions/checkout@v4
        with:
          repository: bloxbean/julc-examples
          path: julc-examples

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ./docs/package-lock.json
            ./julc-playground/frontend/package-lock.json

      # --- Playground (julc.dev/playground/): compiler and VM compiled to WebAssembly, no backend ---

      - name: Set up GraalVM (Web Image)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Remember GraalVM home
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # Gradle itself runs on the same JDK as the main build; GraalVM is only used for the image.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Binaryen
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"

      # Builds the engine into julc-playground/frontend/public/wasm and checks it against the JVM (parity fixtures).
      - name: Build playground engine
        run: ./gradlew :julc-playground-wasm:wasmSmoke -PskipSigning=true --stacktrace

      - name: Build playground frontend
        run: |
          cd julc-playground/frontend
          npm ci
          npm run build:static

      # --- Documentation site ---

      - name: Install dependencies
        run: |
          cd docs
          npm ci

      - name: Build website
        env:
          JULC_EXAMPLES_DIR: ${{ github.workspace }}/julc-examples
        run: |
          cd docs
          npm run build

      - name: Add playground to website
        run: cp -R julc-playground/frontend/dist-static docs/dist/playground

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dist
          cname: julc.dev
