# From the release-ops standard (templates/workflows/docs-deploy.yml, 2026-09-14), adapted for JuLC: the site also
# carries the static playground from the julc GitHub release named in docs/playground-release, and the example
# catalog from bloxbean/julc-examples.
name: Deploy Docs to GitHub Pages

# Pull requests that touch the docs only build. A push to main that touches them, or a manual run on main, also
# pushes the site to the gh-pages branch. The live site does not change until GitHub's Pages deployment for that
# push is approved in the `github-pages` environment, so every publish -- whichever way it was triggered -- goes
# through that approval. Not triggered by tags: anyone with write access can create a non-v* tag.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'gradle.properties'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'gradle.properties'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout examples corpus
        uses: actions/checkout@v4
        with:
          repository: bloxbean/julc-examples
          path: julc-examples
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "./docs/package-lock.json"

      # --- Playground (julc.dev/playground/) ---
      # The static playground (frontend + WebAssembly engine, ADR-054) is built and verified once per julc release
      # by native-image-release.yml and attached to the GitHub release. The site publishes the release named in
      # docs/playground-release, so julc.dev runs the same compiler bytes users install, and this job needs neither
      # GraalVM, Binaryen nor Gradle. To update the playground, bump that file and merge it to main.
      - name: Download playground from the julc release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(tr -d '[:space:]' < docs/playground-release)
          VERSION="${TAG#v}"
          echo "Playground release: $TAG"
          mkdir -p "$RUNNER_TEMP/playground/site"
          cd "$RUNNER_TEMP/playground"
          # gh fails when no asset matches, so a release without a playground bundle stops the deploy.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "julc-playground-static-${VERSION}.tar.gz" \
            --pattern "*-SHA256SUMS.txt"
          # Both the pre17 and ADR-057 names are supported. Select only the manifest
          # that actually names our archive; unrelated release checksums do not count.
          ARCHIVE="julc-playground-static-${VERSION}.tar.gz"
          awk -v archive="$ARCHIVE" '$2 == archive || $2 == "*" archive {print}' \
            ./*-SHA256SUMS.txt > playground.sha256
          test "$(wc -l < playground.sha256 | tr -d ' ')" = 1
          sha256sum --check playground.sha256
          tar xzf "julc-playground-static-${VERSION}.tar.gz" -C site
          test -f site/index.html
          echo "Engine version: $(jq -r .version site/wasm/engine.json)"

      # --- Documentation site ---

      - name: Install dependencies
        run: |
          cd docs
          npm ci

      - name: Build website
        env:
          JULC_EXAMPLES_DIR: ${{ github.workspace }}/julc-examples
        run: |
          cd docs
          npm run build

      - name: Add playground to website
        run: cp -R "$RUNNER_TEMP/playground/site" docs/dist/playground

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to gh-pages
    needs: build
    # Only main publishes; a pull request, or a manual run on another branch, only builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      # Replaces the whole gh-pages tree with the built site.
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: julc.dev

      - name: Record the pending Pages deployment
        shell: bash
        run: |
          {
            echo "## Pushed to gh-pages - waiting for approval"
            echo
            echo "The site updates after the \`pages-build-deployment\` run for this push is approved in the"
            echo "\`github-pages\` environment:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/pages/pages-build-deployment"
            echo
            echo "If several are waiting, approve the newest and reject the older ones."
          } >> "$GITHUB_STEP_SUMMARY"
