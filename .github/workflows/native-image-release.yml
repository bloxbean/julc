name: Native Image Release

# On a v* tag (created by tag-release.yml, like the one that starts release.yml): builds the CLI and playground
# native images, the WebAssembly distributions and the shadow JARs, then -- only with github_release = true in
# gradle.properties -- creates the GitHub release with them and updates the Homebrew formulas. A GitHub release
# and the formula push are public the moment they happen, so both are opt-in rather than an automatic
# consequence of tagging. Everything is still built when github_release is false, so a release is rehearsable
# end to end.
#
# The build jobs run with a read-only token and no secrets. Only github-release gets a write token, only attest
# signs (id-token, attestations: write), only npm-publish can publish to npm (id-token, environment release-staging,
# npm trusted publishing, no npm token), and only update-homebrew gets a secret (HOMEBREW_TAP_TOKEN, environment
# release-staging); none of them runs the Gradle build. No build cache is restored, so nothing from an earlier run
# can change the published binaries. Every action is pinned to a full commit SHA.
#
# The npm packages (ADR-077 D8, D8a): the wasm job packs @julclang/wasm-client, @julclang/julc-vm-wasm and
# @julclang/julc-wasm once, into the run's npm-packages artifact (kept 14 days; the tarballs are not release assets);
# attest signs them and the engine archives with this workflow's identity; github-release attaches the archives;
# npm-publish publishes the artifact's tarballs, verified against the attestation and the release's archives, with
# npm_publish = true in gradle.properties (otherwise npm-dry-run runs the same script with npm publish --dry-run, and
# always for a release candidate of a prerelease); npm-verify then checks what npm serves. A release is built once:
# a re-run never rebuilds it (wasm stops first). Recovery is "Re-run failed jobs" in the original run, or, within the
# artifact's 14 days, this workflow dispatched on the release tag, which runs only npm-gates, npm-dry-run or
# npm-publish, and npm-verify on the tag's push run's artifact (adr/evidence/077-m4/RUNBOOK.md).

on:
  push:
    tags:
      - 'v*'
  # Recovery of a release's npm publication only, from the tag's push run's attested npm files. Dispatch it on the tag
  # itself: gh workflow run native-image-release.yml --ref v<version>. Any other ref is refused (npm-gates).
  workflow_dispatch:

permissions: {}

jobs:
  # Release gate, as in release.yml: the node-diversity uplc-conformance vectors must all give the scenario's expected
  # results on the Java VM before anything is built for the release (ndc-uplc.yml). No secrets.
  # Every build job, attest, github-release and update-homebrew run only for the tag push: a dispatch builds nothing.
  uplc-conformance:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ndc-uplc.yml

  validate:
    needs: uplc-conformance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Read release gates
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gates.outputs.version }}
      is_final: ${{ steps.gates.outputs.is_final }}
      github_release: ${{ steps.gates.outputs.github_release }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate tag and read release gates
      id: gates
      shell: bash
      run: |
        set -euo pipefail
        # gradle.properties uses `key = value`; reading it through Gradle tolerates the spaces.
        PROPS=$(./gradlew -q properties)
        VERSION=$(awk '/^version:/ { print $2; exit }' <<< "$PROPS")
        if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
          echo "::error::Git tag ${GITHUB_REF_NAME} does not match Gradle version ${VERSION}" >&2
          exit 1
        fi
        if [[ "$VERSION" == *SNAPSHOT* ]]; then
          echo "::error::Release tags require a non-SNAPSHOT version. Got: $VERSION" >&2
          exit 1
        fi
        IS_FINAL=false
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          IS_FINAL=true
        fi
        # Default to false: if the property is deleted or the parse fails,
        # publishing must stay off rather than fall open.
        GITHUB_RELEASE=$(awk '/^github_release:/ { print $2; exit }' <<< "$PROPS")
        {
          echo "version=$VERSION"
          echo "is_final=$IS_FINAL"
          echo "github_release=${GITHUB_RELEASE:-false}"
        } >> "$GITHUB_OUTPUT"
        echo "Version $VERSION (final: $IS_FINAL), GitHub release for this tag: ${GITHUB_RELEASE:-false}"

  native-image:
    needs: validate
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-aarch64
            binary: julc
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc
          - os: windows-latest
            label: windows-x86_64
            binary: julc.exe

    runs-on: ${{ matrix.os }}
    name: Build CLI ${{ matrix.label }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      LABEL: ${{ matrix.label }}
      BINARY: ${{ matrix.binary }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Build native image
      run: ./gradlew :julc-cli:nativeCompile -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        STAGING="julc-${VERSION}-${LABEL}"
        mkdir -p "$STAGING"
        cp "julc-cli/build/native/nativeCompile/${BINARY}" "$STAGING/"
        cp julc-cli/README.md "$STAGING/"
        zip -r "julc-${VERSION}-${LABEL}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $STAGING = "julc-$env:VERSION-$env:LABEL"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-cli/build/native/nativeCompile/$env:BINARY" -Destination $STAGING
        Copy-Item "julc-cli/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-$env:VERSION-$env:LABEL.zip"

    - name: Upload release asset
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-cli-${{ matrix.label }}
        path: julc-${{ env.VERSION }}-${{ matrix.label }}.zip
        if-no-files-found: error
        retention-days: 14


  # The browser engine (julc-tools compiled to WebAssembly, ADR-054) is platform-independent, so it is
  # built and verified once here and reused everywhere: the playground native images bundle it, the GitHub release
  # carries it, and docs-deploy.yml publishes the static playground from the release asset.
  wasm:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    name: Build JuLC WebAssembly distributions
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    # ADR-077 D8a: the SHA-256 of the three npm tarballs and the two engine archives, for the checks of this run
    # (attest, npm-publish, npm-verify). The durable anchor is attest's attestation.
    outputs:
      sha256_wasm_client: ${{ steps.npm-files.outputs.sha256_wasm_client }}
      sha256_julc_vm_wasm: ${{ steps.npm-files.outputs.sha256_julc_vm_wasm }}
      sha256_julc_wasm: ${{ steps.npm-files.outputs.sha256_julc_wasm }}
      sha256_vm_archive: ${{ steps.npm-files.outputs.sha256_vm_archive }}
      sha256_full_archive: ${{ steps.npm-files.outputs.sha256_full_archive }}

    steps:
    # ADR-077 D8a: a release is built once. Web Image output is not byte-identical across builds, so a whole-workflow
    # re-run would make different bytes from those already attached (and perhaps on npm). Stop before building when
    # the tag has a GitHub release at all. github-release creates releases published from the start, never drafts, so
    # this read-only token sees every release it made.
    - name: Refuse to build a released version again
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        if ! releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | \"\(.id) \(.assets | length)\"" 2> "$RUNNER_TEMP/releases.err"); then
          cat "$RUNNER_TEMP/releases.err" >&2
          echo "::error::Could not read the GitHub releases; refusing to build without knowing." >&2
          exit 1
        fi
        if [[ -z "$releases" ]]; then
          echo "No GitHub release of v${VERSION} yet: building."
          exit 0
        fi
        echo "::error::v${VERSION} already has a GitHub release (id and asset count: ${releases//$'\n'/; })." \
          "A release is built once (ADR-077 D8a): rebuilding would make different bytes. Use 'Re-run failed jobs' in" \
          "the original run; after a whole-workflow re-run, see 'Recovery' in adr/evidence/077-m4/RUNBOOK.md." >&2
        exit 1

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # Web Image ships with the GraalVM 25.3 innovation release. Only graalvm/setup-graalvm resolves that line
    # (actions/setup-java only sees the 25.0 LTS line); it exports GRAALVM_HOME, which the Gradle build reads.
    # JAVA_HOME stays on the Temurin JDK below, so Gradle itself runs on the same JDK as the main build.
    - name: Set up GraalVM 25.3 (Web Image)
      uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
      with:
        version: '25.3'
        distribution: 'graalvm'
        set-java-home: 'false'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    # Binaryen optimises the engines the archives and npm ship (ADR-077 D8a): pinned by SHA-256, the release's own
    # .sha256 asset, as JOUST pins it. Keep the version and hash the same in native-image-dev.yml.
    - name: Install Binaryen
      shell: bash
      env:
        BINARYEN_VERSION: '132'
        BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
      run: |
        set -euo pipefail
        f="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
        curl -sSfL -o "$RUNNER_TEMP/$f" \
          "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$f"
        echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
        tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

    # Builds the engine (build/wasm-bundle, also copied to frontend/public/wasm) and checks the parity fixtures
    # against the JVM in Node.js. A mismatch fails the release. wasm-package-checks checks @julclang/wasm-client
    # further, from this job's files (ADR-077 M1).
    - name: Build and verify engine
      run: ./gradlew :julc-wasm:wasmSmoke -PskipSigning=true --no-daemon --stacktrace
      shell: bash

    - name: Build static playground
      shell: bash
      run: |
        cd julc-playground/frontend
        npm ci
        npm run build:static

    - name: Package
      shell: bash
      run: |
        set -euo pipefail
        echo "Engine version: $(jq -r .version julc-wasm/build/wasm-bundle-full/engine.json)"
        # Engine only: launcher, module and engine.json under content-addressed names.
        tar czf "julc-wasm-${VERSION}.tar.gz" -C julc-wasm/build/wasm-bundle-full .
        tar czf "julc-vm-wasm-${VERSION}.tar.gz" -C julc-wasm/build/wasm-bundle-vm .
        # Complete static playground (frontend + engine, relative paths): serve it from any path, no backend needed.
        tar czf "julc-playground-static-${VERSION}.tar.gz" -C julc-playground/frontend/dist-static .
        sha256sum "julc-wasm-${VERSION}.tar.gz" "julc-vm-wasm-${VERSION}.tar.gz" "julc-playground-static-${VERSION}.tar.gz" \
          > "julc-wasm-${VERSION}-SHA256SUMS.txt"
        cat "julc-wasm-${VERSION}-SHA256SUMS.txt"
        wc -c julc-wasm/build/wasm-bundle-{full,vm}/*.wasm >> "$GITHUB_STEP_SUMMARY"

    # ADR-077 I1 on what this job packed (wasmSmoke packs the engine packages into julc-wasm/build/npm): each engine
    # tarball and the release archive above, extracted into separate directories, hold the same launcher, module and
    # engine.json byte for byte, and engine.js inlines engine/engine.json. Also checks the tarballs' contents and
    # package.json files (no scripts, exact client dependency).
    - name: Check the engine packages against the release archives
      shell: bash
      run: |
        set -euo pipefail
        test "$(jq -r .julcVersion julc-wasm/build/wasm-bundle-vm/engine.json)" = "$VERSION"
        node julc-wasm/src/test/js/engine-identity.mjs julc-wasm/build/npm . "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

    # ADR-077 D8a: the three tarballs checked above, a checksum file over them and the two engine archives, and their
    # digests as this job's outputs. They are the npm-packages artifact, not release assets: npm is published from it.
    # Nothing repacks them after this step.
    - name: Checksums and digests of the npm tarballs
      id: npm-files
      shell: bash
      run: |
        set -euo pipefail
        files=()
        for name in wasm-client julc-vm-wasm julc-wasm; do
          cp "julc-wasm/build/npm/julclang-${name}-${VERSION}.tgz" .
          files+=("julclang-${name}-${VERSION}.tgz")
        done
        files+=("julc-vm-wasm-${VERSION}.tar.gz" "julc-wasm-${VERSION}.tar.gz")
        sha256sum "${files[@]}" > "julc-npm-${VERSION}-SHA256SUMS.txt"
        cat "julc-npm-${VERSION}-SHA256SUMS.txt" | tee -a "$GITHUB_STEP_SUMMARY"
        digest() { sha256sum "$1" | cut -d' ' -f1; }
        {
          echo "sha256_wasm_client=$(digest "julclang-wasm-client-${VERSION}.tgz")"
          echo "sha256_julc_vm_wasm=$(digest "julclang-julc-vm-wasm-${VERSION}.tgz")"
          echo "sha256_julc_wasm=$(digest "julclang-julc-wasm-${VERSION}.tgz")"
          echo "sha256_vm_archive=$(digest "julc-vm-wasm-${VERSION}.tar.gz")"
          echo "sha256_full_archive=$(digest "julc-wasm-${VERSION}.tar.gz")"
        } >> "$GITHUB_OUTPUT"

    # Picked up by the native-image-playground jobs on every platform, so none of them needs Web Image.
    - name: Upload engine artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: julc-wasm-full
        path: julc-wasm/build/wasm-bundle-full/
        if-no-files-found: error

    - name: Upload release assets
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-wasm
        path: |
          julc-wasm-${{ env.VERSION }}.tar.gz
          julc-vm-wasm-${{ env.VERSION }}.tar.gz
          julc-playground-static-${{ env.VERSION }}.tar.gz
          julc-wasm-${{ env.VERSION }}-SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 14

    # ADR-077 D8a: what npm is published from, by this run or by a recovery dispatch on the tag within 14 days (not a
    # release asset): the three tarballs, the two engine archives (their own copies, the bytes the release attaches) and
    # the npm checksum file over all five. attest attests the five files.
    - name: Upload the npm files
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: npm-packages
        path: |
          julclang-wasm-client-${{ env.VERSION }}.tgz
          julclang-julc-vm-wasm-${{ env.VERSION }}.tgz
          julclang-julc-wasm-${{ env.VERSION }}.tgz
          julc-vm-wasm-${{ env.VERSION }}.tar.gz
          julc-wasm-${{ env.VERSION }}.tar.gz
          julc-npm-${{ env.VERSION }}-SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 14

    # What wasm-package-checks loads: the three packed packages, both bundles and the VM parity fixtures.
    - name: Upload the files the package checks use
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wasm-package-checks
        path: |
          julc-wasm/build/npm/
          julc-wasm/build/wasm-bundle-vm/
          julc-wasm/build/wasm-bundle-full/
          julc-wasm/build/wasm-parity/vm.json
        if-no-files-found: error
        retention-days: 7

  # ADR-077 M1's checks of @julclang/wasm-client and M3's of the engine packages, kept out of the job that builds the
  # release files: it builds nothing, installs Playwright, Node binaries, TypeScript and the fixtures' bundlers from
  # the network, and loads the wasm job's files from its artifact. Read-only token, no secrets.
  wasm-package-checks:
    needs: wasm
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    name: Check the npm packages (Node.js 22.3 and 24, Chromium, bundlers, TypeScript)
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    - name: Download the wasm job's files
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: wasm-package-checks
        path: wasm-checks

    - name: Install Node.js 22.3.0 and 24 for the package smoke
      shell: bash
      run: |
        set -euo pipefail
        # The official linux-x64 archives, pinned by their SHA-256 (nodejs.org's SHASUMS256.txt for each release).
        cat > "$RUNNER_TEMP/node-sums.txt" <<'SUMS'
        33429139d4c4416439bf023b2eb2dc257da188fd793b64f21c8c03a0f04a5840  node-v22.3.0-linux-x64.tar.xz
        4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb  node-v24.22.3-linux-x64.tar.xz
        SUMS
        cd "$RUNNER_TEMP"
        nodes=()
        for version in v22.3.0 v24.22.3; do
          archive="node-${version}-linux-x64.tar.xz"
          curl -sSfLO "https://nodejs.org/dist/${version}/${archive}"
          grep " ${archive}\$" node-sums.txt | sed 's/^ *//' | sha256sum -c -
          tar -xJf "${archive}"
          nodes+=("$RUNNER_TEMP/node-${version}-linux-x64/bin/node")
        done
        echo "WASM_SMOKE_NODES=$(IFS=,; echo "${nodes[*]}")" >> "$GITHUB_ENV"

    # ADR-077 M1: Chromium for the CSP and cached-upgrade checks (wasmBrowserSmoke).
    - name: Install Playwright with Chromium
      shell: bash
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-audit --no-fund playwright@1.64.1
        "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
        echo "PLAYWRIGHT_DIR=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"

    # The same scripts as :julc-wasm:wasmSmokePackage, wasmBrowserSmoke and wasmClientTypes, on the wasm job's files.
    - name: Load the packed client in Node.js, in Chromium, and type-check it
      shell: bash
      run: |
        set -euo pipefail
        tarball=$(ls wasm-checks/npm/julclang-wasm-client-*.tgz)
        mkdir -p "$RUNNER_TEMP/wasm-client" && tar -xzf "$tarball" -C "$RUNNER_TEMP/wasm-client"
        IFS=, read -ra nodes <<< "$WASM_SMOKE_NODES"
        node julc-wasm/src/test/js/package-smoke.mjs "$tarball" wasm-checks/wasm-bundle-vm wasm-checks/wasm-bundle-full \
          wasm-checks/wasm-parity/vm.json "${nodes[@]}"
        node julc-wasm/src/test/js/browser-smoke.mjs "$RUNNER_TEMP/wasm-client/package" wasm-checks/wasm-bundle-vm \
          wasm-checks/wasm-bundle-full "$PLAYWRIGHT_DIR"
        node julc-wasm/src/test/js/package-types.mjs "$tarball" wasm-checks/wasm-bundle-vm \
          wasm-checks/npm/julclang-julc-vm-wasm-*.tgz wasm-checks/npm/julclang-julc-wasm-*.tgz

    # ADR-077 M3 (I6, I8), the same script as :julc-wasm:wasmEngineFixtures: both engine packages, installed from the
    # three tarballs, in Node.js 22.3.0, 22 and 24 (main thread and an application worker, with the VM parity
    # fixtures), in Chromium (plain <script type="module">, Vite 8 development and production, webpack production with
    # and without the README's configuration, a Chrome extension), and in server bundles (webpack target: 'node',
    # esbuild with external packages, Next.js with Turbopack: build and standalone). Bundler versions are locked by the
    # fixtures' lockfiles. Left out to keep this job short: next build --webpack and Vite 7's development server (run by
    # native-image-dev.yml) and next dev (local runs only), each another compile of the same application.
    - name: Load the engine packages in Node.js, Chromium and bundlers
      shell: bash
      run: |
        set -euo pipefail
        version=$(jq -r .julcVersion wasm-checks/wasm-bundle-vm/engine.json)
        node julc-wasm/src/test/js/engine-fixtures.mjs --npm wasm-checks/npm --version "$version" \
          --work "$RUNNER_TEMP/engine-fixtures" --parity wasm-checks/wasm-parity/vm.json --playwright "$PLAYWRIGHT_DIR" \
          --nodes "$WASM_SMOKE_NODES" --only node,plain,vite,webpack,webpack-keep,extension,webpack-node,esbuild,next

  native-image-playground:
    needs: [validate, wasm]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-aarch64
            binary: julc-playground
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc-playground
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc-playground
          - os: windows-latest
            label: windows-x86_64
            binary: julc-playground.exe

    runs-on: ${{ matrix.os }}
    name: Build Playground ${{ matrix.label }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      LABEL: ${{ matrix.label }}
      BINARY: ${{ matrix.binary }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    # The frontend build copies public/wasm into the static resources, so every server binary serves the browser
    # engine at /wasm/ without building Web Image on this platform.
    - name: Add browser engine to the frontend
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: julc-wasm-full
        path: julc-playground/frontend/public/wasm

    - name: Build native image
      run: ./gradlew :julc-playground:nativeCompile -PwithFrontend -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        STAGING="julc-playground-${VERSION}-${LABEL}"
        mkdir -p "$STAGING"
        cp "julc-playground/build/native/nativeCompile/${BINARY}" "$STAGING/"
        cp julc-playground/README.md "$STAGING/"
        zip -r "julc-playground-${VERSION}-${LABEL}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $STAGING = "julc-playground-$env:VERSION-$env:LABEL"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-playground/build/native/nativeCompile/$env:BINARY" -Destination $STAGING
        Copy-Item "julc-playground/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-playground-$env:VERSION-$env:LABEL.zip"

    - name: Upload release asset
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-playground-${{ matrix.label }}
        path: julc-playground-${{ env.VERSION }}-${{ matrix.label }}.zip
        if-no-files-found: error
        retention-days: 14

  shadow-jars:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build Shadow JARs
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Build shadow JARs
      run: ./gradlew :julc-compiler:shadowJar :julc-vm-java:shadowJar -PskipSigning=true --no-daemon

    # Flattened into one directory so the release job attaches the files, not their build paths.
    - name: Collect release assets
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p shadow-dist
        cp julc-compiler/build/libs/julc-compiler-all-*-all.jar julc-vm-java/build/libs/julc-vm-java-all-*-all.jar shadow-dist/
        ls -la shadow-dist

    - name: Upload release assets
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-shadow-jars
        path: shadow-dist/*.jar
        if-no-files-found: error
        retention-days: 14

  # ADR-077 D8a: the durable anchor of the npm files. One GitHub artifact attestation (one statement, five subjects),
  # signed with Sigstore under this workflow's identity at this tag and kept in GitHub's attestation store, of the three
  # npm tarballs and the two engine archives, after checking them against the wasm job's digests. The npm jobs require
  # the five files to be exactly one statement's subjects, so files of two attempts can never be mixed. Every later check (npm-dry-run, npm-publish,
  # npm-verify, a recovery dispatch) verifies each file of the npm-packages artifact with gh attestation verify
  # --signer-workflow ... --source-ref refs/tags/v<version> --source-digest --signer-digest. No build, no checkout.
  attest:
    needs: [validate, wasm]
    if: github.event_name == 'push' && needs.validate.outputs.github_release == 'true'
    runs-on: ubuntu-latest
    name: Attest the npm tarballs and engine archives
    permissions:
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - name: Download the wasm job's npm files
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: npm-packages
        path: dist

    - name: Check them against the wasm job's digests
      shell: bash
      working-directory: dist
      env:
        SHA_CLIENT: ${{ needs.wasm.outputs.sha256_wasm_client }}
        SHA_VM: ${{ needs.wasm.outputs.sha256_julc_vm_wasm }}
        SHA_FULL: ${{ needs.wasm.outputs.sha256_julc_wasm }}
        SHA_VM_ARCHIVE: ${{ needs.wasm.outputs.sha256_vm_archive }}
        SHA_FULL_ARCHIVE: ${{ needs.wasm.outputs.sha256_full_archive }}
      run: |
        set -euo pipefail
        sha256sum -c --strict - <<SUMS
        ${SHA_CLIENT}  julclang-wasm-client-${VERSION}.tgz
        ${SHA_VM}  julclang-julc-vm-wasm-${VERSION}.tgz
        ${SHA_FULL}  julclang-julc-wasm-${VERSION}.tgz
        ${SHA_VM_ARCHIVE}  julc-vm-wasm-${VERSION}.tar.gz
        ${SHA_FULL_ARCHIVE}  julc-wasm-${VERSION}.tar.gz
        SUMS
        sha256sum -c --strict "julc-npm-${VERSION}-SHA256SUMS.txt"

    - name: Attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          dist/julclang-wasm-client-${{ env.VERSION }}.tgz
          dist/julclang-julc-vm-wasm-${{ env.VERSION }}.tgz
          dist/julclang-julc-wasm-${{ env.VERSION }}.tgz
          dist/julc-vm-wasm-${{ env.VERSION }}.tar.gz
          dist/julc-wasm-${{ env.VERSION }}.tar.gz

  github-release:
    needs: [validate, native-image, wasm, wasm-package-checks, native-image-playground, shadow-jars, attest]
    # Gated by github_release in gradle.properties. Runs only when every distribution was built and the npm files are
    # attested, so a release never ships with a platform missing or without its attestation; re-running a failed build
    # job re-runs this one.
    if: github.event_name == 'push' && needs.validate.outputs.github_release == 'true'
    runs-on: ubuntu-latest
    name: Create GitHub release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - name: Download release assets
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: release-*
        path: dist
        merge-multiple: true

    - name: List release assets
      run: ls -la dist/

    # ADR-077 D8a, create-once. The release is created here, published from the start: never a draft (a draft is
    # invisible to the read-only tokens of the build-once check and the npm jobs, and GET /releases/tags never returns
    # one). Then each file is attached unless it already is: a completed asset (state "uploaded") with the same bytes is
    # kept, one with other bytes stops the job before anything is uploaded, and a failed upload's placeholder (state
    # "starter", which an HTTP 502 can leave) is deleted and uploaded again. The npm files are not release assets: npm
    # is published from the run's npm-packages artifact. Uploading to a published release needs the repository's
    # immutable releases off (they are, 2026-11-17).
    - name: Create the release once and attach its assets
      env:
        GH_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ needs.validate.outputs.is_final != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
          --jq ".[] | select(.tag_name == \"v${VERSION}\") | [.id, .draft] | @tsv" > "$RUNNER_TEMP/releases.tsv"
        count=$(wc -l < "$RUNNER_TEMP/releases.tsv" | tr -d ' ')
        if [[ "$count" -gt 1 ]]; then
          echo "::error::${count} releases (drafts included) have tag v${VERSION}; resolve that by hand first." >&2
          exit 1
        fi
        if [[ "$count" == 1 ]]; then
          IFS=$'\t' read -r id draft < "$RUNNER_TEMP/releases.tsv"
          if [[ "$draft" != false ]]; then
            echo "::error::Release ${id} for v${VERSION} is a draft, which this workflow never makes; check its" \
              "assets and publish or delete it by hand first." >&2
            exit 1
          fi
          echo "Release ${id} for v${VERSION} exists."
        else
          # Latest is decided by semantic version and date (legacy), so a maintenance release (e.g. 0.1.3 after 0.2.0)
          # does not take the Latest badge.
          id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name="v${VERSION}" -f name="${VERSION}" \
            -F prerelease="${PRERELEASE}" -F draft=false -f make_latest=legacy --jq .id)
          echo "Created release ${id} for v${VERSION} (prerelease: ${PRERELEASE})."
        fi
        gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${id}/assets?per_page=100" \
          --jq '.[] | [.id, .name, .state, (.digest // "")] | @tsv' > "$RUNNER_TEMP/assets.tsv"
        failed=0
        upload=()
        for file in dist/*; do
          name=$(basename "$file")
          row=$(awk -F'\t' -v name="$name" '$2 == name' "$RUNNER_TEMP/assets.tsv")
          if [[ -z "$row" ]]; then
            upload+=("$file")
            continue
          fi
          IFS=$'\t' read -r asset _ state digest <<< "$row"
          if [[ "$state" == starter ]]; then
            echo "Deleting ${name}'s failed upload (state starter); it is uploaded again from this run's bytes."
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
            upload+=("$file")
            continue
          fi
          if [[ "$state" != uploaded ]]; then
            echo "::error::Release asset ${name} is in state ${state}." >&2
            failed=1
            continue
          fi
          ours=$(sha256sum "$file" | cut -d' ' -f1)
          if [[ -n "$digest" ]]; then
            theirs=${digest#sha256:}
          else
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}" \
              > "$RUNNER_TEMP/asset"
            theirs=$(sha256sum "$RUNNER_TEMP/asset" | cut -d' ' -f1)
          fi
          if [[ "$theirs" == "$ours" ]]; then
            echo "Keeping ${name}: already attached, the same bytes."
          else
            echo "::error::Release asset ${name} is already attached with other bytes (${theirs}, this run: ${ours})." \
              "A completed asset is never replaced (ADR-077 I11)." >&2
            failed=1
          fi
        done
        if [[ "$failed" != 0 ]]; then exit 1; fi
        for file in "${upload[@]+"${upload[@]}"}"; do
          echo "Attaching $(basename "$file")."
          gh release upload "v${VERSION}" "$file" --repo "$GITHUB_REPOSITORY"
        done

    # ADR-077 D8a: what the release holds now. Exactly one release for the tag, published (not a draft), and every
    # file of this run attached, completed, with this run's bytes.
    - name: Verify the release's assets
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
          --jq ".[] | select(.tag_name == \"v${VERSION}\") | [.id, .draft] | @tsv" > "$RUNNER_TEMP/releases.tsv"
        if [[ "$(wc -l < "$RUNNER_TEMP/releases.tsv" | tr -d ' ')" != 1 ]]; then
          echo "::error::Expected exactly one release for v${VERSION}:" >&2
          cat "$RUNNER_TEMP/releases.tsv" >&2
          exit 1
        fi
        IFS=$'\t' read -r id draft < "$RUNNER_TEMP/releases.tsv"
        if [[ "$draft" != false ]]; then
          echo "::error::The release of v${VERSION} is still a draft." >&2
          exit 1
        fi
        gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${id}/assets?per_page=100" \
          --jq '.[] | [.id, .name, .state, (.digest // "")] | @tsv' > "$RUNNER_TEMP/assets.tsv"
        failed=0
        for file in dist/*; do
          name=$(basename "$file")
          row=$(awk -F'\t' -v name="$name" '$2 == name' "$RUNNER_TEMP/assets.tsv")
          if [[ -z "$row" ]]; then
            echo "::error::${name} is not attached to the release." >&2
            failed=1
            continue
          fi
          IFS=$'\t' read -r asset _ state digest <<< "$row"
          ours=$(sha256sum "$file" | cut -d' ' -f1)
          if [[ -n "$digest" ]]; then
            theirs=${digest#sha256:}
          else
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}" \
              > "$RUNNER_TEMP/asset"
            theirs=$(sha256sum "$RUNNER_TEMP/asset" | cut -d' ' -f1)
          fi
          if [[ "$state" != uploaded || "$theirs" != "$ours" ]]; then
            echo "::error::${name}: state ${state}, sha256 ${theirs}; this run's is ${ours}." >&2
            failed=1
          fi
        done
        exit "$failed"

  # ADR-077 D8 and D8a: whether and how npm-publish runs, read without Gradle from gradle.properties at the tag, for a
  # tag push and for a recovery dispatch alike. The ref must be exactly refs/tags/v<version>, with the version
  # gradle.properties holds at that tag. mode: publish (github_release and npm_publish true, and a form D8 publishes:
  # npm-publish), dry-run (github_release true otherwise, including a release candidate of a prerelease: npm-dry-run),
  # none (no GitHub release to publish from).
  npm-gates:
    runs-on: ubuntu-latest
    name: Read the npm gates
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gates.outputs.version }}
      mode: ${{ steps.gates.outputs.mode }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        sparse-checkout: |
          gradle.properties
          julc-wasm/src/ci
        sparse-checkout-cone-mode: false

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.22.3'

    - name: Check the ref and read the gates
      id: gates
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! "$GITHUB_REF" =~ ^refs/tags/v([0-9].*)$ ]]; then
          echo "::error::This workflow runs on a release tag, not ${GITHUB_REF}. To recover a release's npm" \
            "publication, dispatch it on the tag: gh workflow run native-image-release.yml --ref v<version>." >&2
          exit 1
        fi
        VERSION=${BASH_REMATCH[1]}
        props=$(git show "${GITHUB_SHA}:gradle.properties")
        # gradle.properties uses `key = value`.
        prop() {
          awk -v key="$1" '{ line = $0; sub(/[ \t]*[=:].*$/, "", line); sub(/^[ \t]+/, "", line) }
            line == key { sub(/^[^=:]*[=:][ \t]*/, ""); sub(/[ \t\r]+$/, ""); print; exit }' <<< "$props"
        }
        GRADLE_VERSION=$(prop version)
        if [[ "$GRADLE_VERSION" != "$VERSION" ]]; then
          echo "::error::Tag v${VERSION} does not match version ${GRADLE_VERSION} in gradle.properties at that tag." >&2
          exit 1
        fi
        if [[ "$VERSION" == *SNAPSHOT* ]]; then
          echo "::error::A snapshot version is never published to npm: ${VERSION}." >&2
          exit 1
        fi
        # Default to false: a missing or unparseable property must not publish.
        GITHUB_RELEASE=$(prop github_release)
        NPM_PUBLISH=$(prop npm_publish)
        # D8's forms, with the publisher's own classifier (julc-wasm/src/ci/npm-gate.mjs, npm-release.mjs versionKind):
        # X.Y.Z, -preN, -betaN and -rcN are published; -preN-rcN, a release candidate of a prerelease, only dry-runs
        # (semver orders it above -preN); any other form, or a version outside npm's semver limits, has no npm rule.
        if [[ "${GITHUB_RELEASE:-false}" != true ]]; then
          KIND=n/a
          MODE=none
        elif ! KIND=$(node julc-wasm/src/ci/npm-gate.mjs "$VERSION"); then
          echo "::error::npm has no rule for v${VERSION}: ADR-077 D8 publishes only X.Y.Z, X.Y.Z-preN, X.Y.Z-betaN and" \
            "X.Y.Z-rcN, and dry-runs X.Y.Z-preN-rcN." >&2
          exit 1
        elif [[ "${NPM_PUBLISH:-false}" == true && "$KIND" == publishable ]]; then
          MODE=publish
        else
          MODE=dry-run
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        echo "v${VERSION} (${GITHUB_EVENT_NAME}): github_release=${GITHUB_RELEASE:-false}," \
          "npm_publish=${NPM_PUBLISH:-false}, form: ${KIND}; npm: ${MODE}" | tee -a "$GITHUB_STEP_SUMMARY"

  # ADR-077 D8 and D8a: a dry run instead of a publication (npm_publish = false, or X.Y.Z-preN-rcN). The same
  # script, on the same verified npm files, with npm publish --dry-run; read-only, no environment, no id-token.
  npm-dry-run:
    needs: [npm-gates, wasm, attest, github-release]
    if: >-
      ${{ !cancelled() && needs.npm-gates.result == 'success' && needs.npm-gates.outputs.mode == 'dry-run'
      && (github.event_name == 'workflow_dispatch'
      || (needs.github-release.result == 'success' && needs.attest.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Dry-run the npm publication
    permissions:
      contents: read
      attestations: read
      # The npm-packages artifact of another run (a recovery dispatch): finding the run and downloading it.
      actions: read
    env:
      VERSION: ${{ needs.npm-gates.outputs.version }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        sparse-checkout: julc-wasm/src/ci
        sparse-checkout-cone-mode: false

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.22.3'

    - name: Install npm 11.21.1
      shell: bash
      run: |
        set -euo pipefail
        f="$RUNNER_TEMP/npm-11.21.1.tgz"
        curl -sSfL -o "$f" https://registry.npmjs.org/npm/-/npm-11.21.1.tgz
        echo "dd77c48eb845f4856c2cdba347cfb52bd877a2655a1ea48ff0c4796e3df9dd7b  $f" | sha256sum -c -
        npm install -g --ignore-scripts --offline "$f"
        test "$(npm --version)" = 11.21.1

    # The npm files come from the npm-packages artifact of the run that built them (kept 14 days), not from the release:
    # this run's own on a tag push, the tag's push run's on a recovery dispatch.
    - name: Find the run that built the npm files
      id: run
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_DIGEST: ${{ github.sha }}
      shell: bash
      run: bash julc-wasm/src/ci/npm-run.sh "$VERSION"

    - name: Download this run's npm files
      if: github.event_name == 'push'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: npm-packages
        path: assets

    # By the artifact id npm-run.sh inspected (its run's only live npm-packages), not by name. merge-multiple puts the
    # files directly in assets/, as a download by name does.
    - name: Download the npm files of the tag's run
      if: github.event_name == 'workflow_dispatch'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        artifact-ids: ${{ steps.run.outputs.artifact_id }}
        merge-multiple: true
        path: assets
        run-id: ${{ steps.run.outputs.run_id }}
        github-token: ${{ github.token }}

    - name: Verify the npm files against their attestation and the release's archives
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_DIGEST: ${{ github.sha }}
        SIGNER_DIGEST: ${{ github.workflow_sha }}
        # The run the artifact came from: the one attest statement covering the five files must be that run's.
        NPM_FILES_RUN: ${{ steps.run.outputs.run_id || github.run_id }}
      shell: bash
      run: bash julc-wasm/src/ci/npm-files.sh "$VERSION" assets

    - name: Dry run
      env:
        SHA_CLIENT: ${{ needs.wasm.outputs.sha256_wasm_client }}
        SHA_VM: ${{ needs.wasm.outputs.sha256_julc_vm_wasm }}
        SHA_FULL: ${{ needs.wasm.outputs.sha256_julc_wasm }}
        SHA_VM_ARCHIVE: ${{ needs.wasm.outputs.sha256_vm_archive }}
        SHA_FULL_ARCHIVE: ${{ needs.wasm.outputs.sha256_full_archive }}
      shell: bash
      run: |
        set -euo pipefail
        digests=()
        if [[ "$GITHUB_EVENT_NAME" == push ]]; then
          for pair in "julclang-wasm-client-${VERSION}.tgz=${SHA_CLIENT}" "julclang-julc-vm-wasm-${VERSION}.tgz=${SHA_VM}" \
              "julclang-julc-wasm-${VERSION}.tgz=${SHA_FULL}" "julc-vm-wasm-${VERSION}.tar.gz=${SHA_VM_ARCHIVE}" \
              "julc-wasm-${VERSION}.tar.gz=${SHA_FULL_ARCHIVE}"; do
            digests+=(--digest "$pair")
          done
        fi
        node julc-wasm/src/ci/npm-publish.mjs --dir assets --version "$VERSION" --mode dry-run "${digests[@]}"

  # ADR-077 D8a. Publishes the run's three npm tarballs, verified against attest's attestation (and, in the tag's
  # own run, the wasm job's digests), with npm trusted publishing: npm exchanges this job's GitHub OIDC token for
  # publish credentials, so there is no npm token. Each package's trusted publisher on npmjs.com names bloxbean/julc,
  # this workflow file and the release-staging environment (release-ops' environment for release jobs). npm checks no
  # ref, and release-staging admits main and release/** as well as v* tags, so the job's own exact-ref check below is
  # the control against a dispatch from a branch; a v* tag itself needs the tag ruleset and tag-release.yml's
  # release-owner authorisation. No Gradle, no build, no npm install and no package scripts: it checks out only
  # julc-wasm/src/ci (release-owner reviewed, CODEOWNERS), the scripts it runs, at the tag's own commit. Runs after a
  # successful github-release and attest, or on a recovery dispatch (whose skipped needs would otherwise skip it:
  # hence the status function, and no bare always()).
  npm-publish:
    needs: [npm-gates, wasm, attest, github-release]
    if: >-
      ${{ !cancelled() && needs.npm-gates.result == 'success' && needs.npm-gates.outputs.mode == 'publish'
      && (github.event_name == 'workflow_dispatch'
      || (needs.github-release.result == 'success' && needs.attest.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: Publish the npm packages
    environment: release-staging
    # One npm publication at a time, of any version: the dist-tags are shared by every version, and each package's tag
    # is chosen inside this job from the registry as it is then (M4-C8). A running publication is never cancelled.
    # GitHub keeps one pending job per group: a newer pending job cancels an older pending one, which then shows as
    # cancelled and is finished by dispatching this workflow on that release's tag (RUNBOOK.md).
    concurrency:
      group: npm-publish-julclang
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: read
      # The npm-packages artifact of another run (a recovery dispatch): finding the run and downloading it.
      actions: read
    outputs:
      published: ${{ steps.publish.outputs.published }}
      # The dist-tag chosen for each package this run published (JSON), which npm-verify checks.
      tags: ${{ steps.publish.outputs.tags }}
    env:
      VERSION: ${{ needs.npm-gates.outputs.version }}
    steps:
    # The control against main and release/**, which release-staging also admits: fatal before anything else runs.
    - name: Refuse any ref but the release tag
      shell: bash
      run: |
        if [[ -z "$VERSION" || "$GITHUB_REF" != "refs/tags/v${VERSION}" ]]; then
          echo "::error::npm-publish runs only on refs/tags/v${VERSION}, not ${GITHUB_REF}." >&2
          exit 1
        fi

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        sparse-checkout: julc-wasm/src/ci
        sparse-checkout-cone-mode: false

    # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1: both exact here.
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.22.3'
        registry-url: 'https://registry.npmjs.org'

    # The npm tarball pinned by SHA-256 (its registry integrity is
    # sha512-YTzL6QBEJXyHcTu0JiUc7RKMp+mzlJtl7rGLmERaXUQeFHIMc9atdr6G9M9C8vDWbv40epoTQAzNL2/PtZVDhQ==), installed
    # offline: its dependencies are bundled.
    - name: Install npm 11.21.1
      shell: bash
      run: |
        set -euo pipefail
        f="$RUNNER_TEMP/npm-11.21.1.tgz"
        curl -sSfL -o "$f" https://registry.npmjs.org/npm/-/npm-11.21.1.tgz
        echo "dd77c48eb845f4856c2cdba347cfb52bd877a2655a1ea48ff0c4796e3df9dd7b  $f" | sha256sum -c -
        npm install -g --ignore-scripts --offline "$f"
        test "$(npm --version)" = 11.21.1

    # The npm files come from the npm-packages artifact of the run that built them (kept 14 days), not from the release:
    # this run's own on a tag push, the tag's push run's on a recovery dispatch.
    - name: Find the run that built the npm files
      id: run
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_DIGEST: ${{ github.sha }}
      shell: bash
      run: bash julc-wasm/src/ci/npm-run.sh "$VERSION"

    - name: Download this run's npm files
      if: github.event_name == 'push'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: npm-packages
        path: assets

    # By the artifact id npm-run.sh inspected (its run's only live npm-packages), not by name. merge-multiple puts the
    # files directly in assets/, as a download by name does.
    - name: Download the npm files of the tag's run
      if: github.event_name == 'workflow_dispatch'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        artifact-ids: ${{ steps.run.outputs.artifact_id }}
        merge-multiple: true
        path: assets
        run-id: ${{ steps.run.outputs.run_id }}
        github-token: ${{ github.token }}

    - name: Verify the npm files against their attestation and the release's archives
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_DIGEST: ${{ github.sha }}
        SIGNER_DIGEST: ${{ github.workflow_sha }}
        # The run the artifact came from: the one attest statement covering the five files must be that run's.
        NPM_FILES_RUN: ${{ steps.run.outputs.run_id || github.run_id }}
      shell: bash
      run: bash julc-wasm/src/ci/npm-files.sh "$VERSION" assets

    - name: Publish
      id: publish
      env:
        SHA_CLIENT: ${{ needs.wasm.outputs.sha256_wasm_client }}
        SHA_VM: ${{ needs.wasm.outputs.sha256_julc_vm_wasm }}
        SHA_FULL: ${{ needs.wasm.outputs.sha256_julc_wasm }}
        SHA_VM_ARCHIVE: ${{ needs.wasm.outputs.sha256_vm_archive }}
        SHA_FULL_ARCHIVE: ${{ needs.wasm.outputs.sha256_full_archive }}
      shell: bash
      run: |
        set -euo pipefail
        # In the tag's own run, the wasm job's digests too; a recovery dispatch has only the attestation.
        digests=()
        if [[ "$GITHUB_EVENT_NAME" == push ]]; then
          for pair in "julclang-wasm-client-${VERSION}.tgz=${SHA_CLIENT}" "julclang-julc-vm-wasm-${VERSION}.tgz=${SHA_VM}" \
              "julclang-julc-wasm-${VERSION}.tgz=${SHA_FULL}" "julc-vm-wasm-${VERSION}.tar.gz=${SHA_VM_ARCHIVE}" \
              "julc-wasm-${VERSION}.tar.gz=${SHA_FULL_ARCHIVE}"; do
            digests+=(--digest "$pair")
          done
        fi
        node julc-wasm/src/ci/npm-publish.mjs --dir assets --version "$VERSION" --mode publish "${digests[@]}"

  # ADR-077 D8a, I1, I12: what npm serves, after a real or verified publication (never after a dry run). No id-token,
  # no environment, no secrets. Installs with --ignore-scripts.
  npm-verify:
    needs: [npm-gates, wasm, npm-publish]
    if: ${{ !cancelled() && needs.npm-publish.result == 'success' && needs.npm-publish.outputs.published == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Verify the npm packages on the registry
    permissions:
      contents: read
      attestations: read
      # The npm-packages artifact of another run (a recovery dispatch): finding the run and downloading it.
      actions: read
    env:
      VERSION: ${{ needs.npm-gates.outputs.version }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        sparse-checkout: julc-wasm/src/ci
        sparse-checkout-cone-mode: false

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.22.3'

    - name: Install npm 11.21.1
      shell: bash
      run: |
        set -euo pipefail
        f="$RUNNER_TEMP/npm-11.21.1.tgz"
        curl -sSfL -o "$f" https://registry.npmjs.org/npm/-/npm-11.21.1.tgz
        echo "dd77c48eb845f4856c2cdba347cfb52bd877a2655a1ea48ff0c4796e3df9dd7b  $f" | sha256sum -c -
        npm install -g --ignore-scripts --offline "$f"
        test "$(npm --version)" = 11.21.1

    # The npm files come from the npm-packages artifact of the run that built them (kept 14 days), not from the release:
    # this run's own on a tag push, the tag's push run's on a recovery dispatch.
    - name: Find the run that built the npm files
      id: run
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_DIGEST: ${{ github.sha }}
      shell: bash
      run: bash julc-wasm/src/ci/npm-run.sh "$VERSION"

    - name: Download this run's npm files
      if: github.event_name == 'push'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: npm-packages
        path: assets

    # By the artifact id npm-run.sh inspected (its run's only live npm-packages), not by name. merge-multiple puts the
    # files directly in assets/, as a download by name does.
    - name: Download the npm files of the tag's run
      if: github.event_name == 'workflow_dispatch'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        artifact-ids: ${{ steps.run.outputs.artifact_id }}
        merge-multiple: true
        path: assets
        run-id: ${{ steps.run.outputs.run_id }}
        github-token: ${{ github.token }}

    - name: Verify the npm files against their attestation and the release's archives
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_DIGEST: ${{ github.sha }}
        SIGNER_DIGEST: ${{ github.workflow_sha }}
        # The run the artifact came from: the one attest statement covering the five files must be that run's.
        NPM_FILES_RUN: ${{ steps.run.outputs.run_id || github.run_id }}
      shell: bash
      run: bash julc-wasm/src/ci/npm-files.sh "$VERSION" assets

    - name: Compare the registry with the release, audit signatures, check provenance
      env:
        SHA_CLIENT: ${{ needs.wasm.outputs.sha256_wasm_client }}
        SHA_VM: ${{ needs.wasm.outputs.sha256_julc_vm_wasm }}
        SHA_FULL: ${{ needs.wasm.outputs.sha256_julc_wasm }}
        SHA_VM_ARCHIVE: ${{ needs.wasm.outputs.sha256_vm_archive }}
        SHA_FULL_ARCHIVE: ${{ needs.wasm.outputs.sha256_full_archive }}
        PUBLISHED_TAGS: ${{ needs.npm-publish.outputs.tags }}
      shell: bash
      run: |
        set -euo pipefail
        digests=()
        if [[ "$GITHUB_EVENT_NAME" == push ]]; then
          for pair in "julclang-wasm-client-${VERSION}.tgz=${SHA_CLIENT}" "julclang-julc-vm-wasm-${VERSION}.tgz=${SHA_VM}" \
              "julclang-julc-wasm-${VERSION}.tgz=${SHA_FULL}" "julc-vm-wasm-${VERSION}.tar.gz=${SHA_VM_ARCHIVE}" \
              "julc-wasm-${VERSION}.tar.gz=${SHA_FULL_ARCHIVE}"; do
            digests+=(--digest "$pair")
          done
        fi
        node julc-wasm/src/ci/npm-verify.mjs --dir assets --version "$VERSION" --work "$RUNNER_TEMP/npm-verify" \
          --published-tags "${PUBLISHED_TAGS:-"{}"}" "${digests[@]}"

  update-homebrew:
    needs: [validate, github-release]
    # Pushes a commit to bloxbean/homebrew-tap and downloads the release assets,
    # so it cannot run without a release: the formula URLs would 404 and the tap
    # would point at assets that do not exist.
    if: github.event_name == 'push' && needs.validate.outputs.github_release == 'true'
    runs-on: ubuntu-latest
    name: Update Homebrew formulas
    # HOMEBREW_TAP_TOKEN is a secret of this environment, which only accepts v* tags (created by the release
    # App or an org admin), main and release/**. The job needs nothing from this repository's token.
    environment: release-staging
    permissions: {}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - name: Checkout homebrew-tap
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: bloxbean/homebrew-tap
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        # The token is only needed for the push below, which passes it explicitly.
        persist-credentials: false

    - name: Update julc formula
      shell: bash
      run: |
        set -euo pipefail

        # Download release assets
        curl -fSL -o macos.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-macos-aarch64.zip"
        curl -fSL -o linux.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-linux-x86_64.zip"
        curl -fSL -o linux-arm.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-linux-arm64.zip"

        MACOS_SHA=$(sha256sum macos.zip | awk '{print $1}')
        LINUX_SHA=$(sha256sum linux.zip | awk '{print $1}')
        LINUX_ARM_SHA=$(sha256sum linux-arm.zip | awk '{print $1}')

        mkdir -p Formula
        cat > Formula/julc.rb << FORMULA
        class Julc < Formula
          desc "JuLC Cardano smart contract toolkit"
          homepage "https://github.com/bloxbean/julc"
          version "${VERSION}"
          license "MIT"

          on_macos do
            if Hardware::CPU.arm?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-macos-aarch64.zip"
              sha256 "${MACOS_SHA}"
            end
          end

          on_linux do
            if Hardware::CPU.intel?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-linux-x86_64.zip"
              sha256 "${LINUX_SHA}"
            elsif Hardware::CPU.arm?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-linux-arm64.zip"
              sha256 "${LINUX_ARM_SHA}"
            end
          end

          def install
            bin.install "julc"
          end

          test do
            assert_match version.to_s, shell_output("#{bin}/julc --version")
          end
        end
        FORMULA

        # Remove leading whitespace from heredoc (YAML run block adds 8 spaces)
        sed -i 's/^        //' Formula/julc.rb

    - name: Update julc-playground formula
      shell: bash
      run: |
        set -euo pipefail

        # Download playground release assets
        curl -fSL -o playground-macos.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-macos-aarch64.zip"
        curl -fSL -o playground-linux.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-linux-x86_64.zip"
        curl -fSL -o playground-linux-arm.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-linux-arm64.zip"

        PG_MACOS_SHA=$(sha256sum playground-macos.zip | awk '{print $1}')
        PG_LINUX_SHA=$(sha256sum playground-linux.zip | awk '{print $1}')
        PG_LINUX_ARM_SHA=$(sha256sum playground-linux-arm.zip | awk '{print $1}')

        mkdir -p Formula
        cat > Formula/julc-playground.rb << FORMULA
        class JulcPlayground < Formula
          desc "JuLC Playground - Web-based JuLC editor and compiler"
          homepage "https://github.com/bloxbean/julc"
          version "${VERSION}"
          license "MIT"

          on_macos do
            if Hardware::CPU.arm?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-macos-aarch64.zip"
              sha256 "${PG_MACOS_SHA}"
            end
          end

          on_linux do
            if Hardware::CPU.intel?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-linux-x86_64.zip"
              sha256 "${PG_LINUX_SHA}"
            elsif Hardware::CPU.arm?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-linux-arm64.zip"
              sha256 "${PG_LINUX_ARM_SHA}"
            end
          end

          def install
            bin.install "julc-playground"
          end

          test do
            # Start server in background, check health endpoint, then stop
            port = free_port
            pid = fork do
              ENV["JULC_PLAYGROUND_PORT"] = port.to_s
              exec bin/"julc-playground"
            end
            sleep 3
            begin
              output = shell_output("curl -s http://localhost:#{port}/api/health")
              assert_match "ok", output.downcase
            ensure
              Process.kill("TERM", pid)
              Process.wait(pid)
            end
          end
        end
        FORMULA

        # Remove leading whitespace from heredoc (YAML run block adds 8 spaces)
        sed -i 's/^        //' Formula/julc-playground.rb

    - name: Commit and push
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/julc.rb Formula/julc-playground.rb
        if git diff --cached --quiet; then
          echo "Formulas already at ${VERSION} - nothing to push."
          exit 0
        fi
        git commit -m "julc ${VERSION}"
        git remote set-url origin "https://x-access-token:${TAP_TOKEN}@github.com/bloxbean/homebrew-tap.git"
        git push
