name: Native Image Release

# On a v* tag (created by tag-release.yml, like the one that starts release.yml): builds the CLI and playground
# native images, the WebAssembly distributions and the shadow JARs, then -- only with github_release = true in
# gradle.properties -- creates the GitHub release with them and updates the Homebrew formulas. A GitHub release
# and the formula push are public the moment they happen, so both are opt-in rather than an automatic
# consequence of tagging. Everything is still built when github_release is false, so a release is rehearsable
# end to end.
#
# The build jobs run with a read-only token and no secrets. Only github-release gets a write token, and only
# update-homebrew gets a secret (HOMEBREW_TAP_TOKEN, environment release-staging); neither runs the Gradle
# build. No build cache is restored, so nothing from an earlier run can change the published binaries.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Read release gates
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gates.outputs.version }}
      is_final: ${{ steps.gates.outputs.is_final }}
      github_release: ${{ steps.gates.outputs.github_release }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate tag and read release gates
      id: gates
      shell: bash
      run: |
        set -euo pipefail
        # gradle.properties uses `key = value`; reading it through Gradle tolerates the spaces.
        PROPS=$(./gradlew -q properties)
        VERSION=$(awk '/^version:/ { print $2; exit }' <<< "$PROPS")
        if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
          echo "::error::Git tag ${GITHUB_REF_NAME} does not match Gradle version ${VERSION}" >&2
          exit 1
        fi
        if [[ "$VERSION" == *SNAPSHOT* ]]; then
          echo "::error::Release tags require a non-SNAPSHOT version. Got: $VERSION" >&2
          exit 1
        fi
        IS_FINAL=false
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          IS_FINAL=true
        fi
        # Default to false: if the property is deleted or the parse fails,
        # publishing must stay off rather than fall open.
        GITHUB_RELEASE=$(awk '/^github_release:/ { print $2; exit }' <<< "$PROPS")
        {
          echo "version=$VERSION"
          echo "is_final=$IS_FINAL"
          echo "github_release=${GITHUB_RELEASE:-false}"
        } >> "$GITHUB_OUTPUT"
        echo "Version $VERSION (final: $IS_FINAL), GitHub release for this tag: ${GITHUB_RELEASE:-false}"

  native-image:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-aarch64
            binary: julc
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc
          - os: windows-latest
            label: windows-x86_64
            binary: julc.exe

    runs-on: ${{ matrix.os }}
    name: Build CLI ${{ matrix.label }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      LABEL: ${{ matrix.label }}
      BINARY: ${{ matrix.binary }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Build native image
      run: ./gradlew :julc-cli:nativeCompile -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        STAGING="julc-${VERSION}-${LABEL}"
        mkdir -p "$STAGING"
        cp "julc-cli/build/native/nativeCompile/${BINARY}" "$STAGING/"
        cp julc-cli/README.md "$STAGING/"
        zip -r "julc-${VERSION}-${LABEL}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $STAGING = "julc-$env:VERSION-$env:LABEL"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-cli/build/native/nativeCompile/$env:BINARY" -Destination $STAGING
        Copy-Item "julc-cli/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-$env:VERSION-$env:LABEL.zip"

    - name: Upload release asset
      uses: actions/upload-artifact@v4
      with:
        name: release-cli-${{ matrix.label }}
        path: julc-${{ env.VERSION }}-${{ matrix.label }}.zip
        if-no-files-found: error
        retention-days: 7


  # The browser engine (julc-tools compiled to WebAssembly, ADR-054) is platform-independent, so it is
  # built and verified once here and reused everywhere: the playground native images bundle it, the GitHub release
  # carries it, and docs-deploy.yml publishes the static playground from the release asset.
  wasm:
    needs: validate
    runs-on: ubuntu-22.04
    name: Build JuLC WebAssembly distributions
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Web Image ships with the GraalVM 25.3 innovation release. Only graalvm/setup-graalvm resolves that line
    # (actions/setup-java only sees the 25.0 LTS line); it exports GRAALVM_HOME, which the Gradle build reads.
    # JAVA_HOME stays on the Temurin JDK below, so Gradle itself runs on the same JDK as the main build.
    - name: Set up GraalVM 25.3 (Web Image)
      uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
      with:
        version: '25.3'
        distribution: 'graalvm'
        set-java-home: 'false'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Binaryen
      shell: bash
      run: |
        curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
          | tar xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"

    # Builds the engine (build/wasm-bundle, also copied to frontend/public/wasm) and checks the parity fixtures
    # against the JVM in Node.js. A mismatch fails the release.
    - name: Build and verify engine
      run: ./gradlew :julc-wasm:wasmSmoke -PskipSigning=true --no-daemon --stacktrace
      shell: bash

    - name: Build static playground
      shell: bash
      run: |
        cd julc-playground/frontend
        npm ci
        npm run build:static

    - name: Package
      shell: bash
      run: |
        set -euo pipefail
        echo "Engine version: $(jq -r .version julc-wasm/build/wasm-bundle-full/engine.json)"
        # Engine only: launcher, module and engine.json under content-addressed names.
        tar czf "julc-wasm-${VERSION}.tar.gz" -C julc-wasm/build/wasm-bundle-full .
        tar czf "julc-vm-wasm-${VERSION}.tar.gz" -C julc-wasm/build/wasm-bundle-vm .
        # Complete static playground (frontend + engine, relative paths): serve it from any path, no backend needed.
        tar czf "julc-playground-static-${VERSION}.tar.gz" -C julc-playground/frontend/dist-static .
        sha256sum "julc-wasm-${VERSION}.tar.gz" "julc-vm-wasm-${VERSION}.tar.gz" "julc-playground-static-${VERSION}.tar.gz" \
          > "julc-wasm-${VERSION}-SHA256SUMS.txt"
        cat "julc-wasm-${VERSION}-SHA256SUMS.txt"
        wc -c julc-wasm/build/wasm-bundle-{full,vm}/*.wasm >> "$GITHUB_STEP_SUMMARY"

    # Picked up by the native-image-playground jobs on every platform, so none of them needs Web Image.
    - name: Upload engine artifact
      uses: actions/upload-artifact@v4
      with:
        name: julc-wasm-full
        path: julc-wasm/build/wasm-bundle-full/
        if-no-files-found: error

    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: release-wasm
        path: |
          julc-wasm-${{ env.VERSION }}.tar.gz
          julc-vm-wasm-${{ env.VERSION }}.tar.gz
          julc-playground-static-${{ env.VERSION }}.tar.gz
          julc-wasm-${{ env.VERSION }}-SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 7

  native-image-playground:
    needs: [validate, wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-aarch64
            binary: julc-playground
          - os: ubuntu-22.04
            label: linux-x86_64
            binary: julc-playground
          - os: ubuntu-22.04-arm
            label: linux-arm64
            binary: julc-playground
          - os: windows-latest
            label: windows-x86_64
            binary: julc-playground.exe

    runs-on: ${{ matrix.os }}
    name: Build Playground ${{ matrix.label }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      LABEL: ${{ matrix.label }}
      BINARY: ${{ matrix.binary }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    # The frontend build copies public/wasm into the static resources, so every server binary serves the browser
    # engine at /wasm/ without building Web Image on this platform.
    - name: Add browser engine to the frontend
      uses: actions/download-artifact@v4
      with:
        name: julc-wasm-full
        path: julc-playground/frontend/public/wasm

    - name: Build native image
      run: ./gradlew :julc-playground:nativeCompile -PwithFrontend -PskipSigning=true --no-daemon
      shell: bash

    - name: Package (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        STAGING="julc-playground-${VERSION}-${LABEL}"
        mkdir -p "$STAGING"
        cp "julc-playground/build/native/nativeCompile/${BINARY}" "$STAGING/"
        cp julc-playground/README.md "$STAGING/"
        zip -r "julc-playground-${VERSION}-${LABEL}.zip" "$STAGING"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $STAGING = "julc-playground-$env:VERSION-$env:LABEL"
        New-Item -ItemType Directory -Path $STAGING -Force
        Copy-Item "julc-playground/build/native/nativeCompile/$env:BINARY" -Destination $STAGING
        Copy-Item "julc-playground/README.md" -Destination $STAGING
        Compress-Archive -Path $STAGING -DestinationPath "julc-playground-$env:VERSION-$env:LABEL.zip"

    - name: Upload release asset
      uses: actions/upload-artifact@v4
      with:
        name: release-playground-${{ matrix.label }}
        path: julc-playground-${{ env.VERSION }}-${{ matrix.label }}.zip
        if-no-files-found: error
        retention-days: 7

  shadow-jars:
    needs: validate
    runs-on: ubuntu-latest
    name: Build Shadow JARs
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Build shadow JARs
      run: ./gradlew :julc-compiler:shadowJar :julc-vm-java:shadowJar -PskipSigning=true --no-daemon

    # Flattened into one directory so the release job attaches the files, not their build paths.
    - name: Collect release assets
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p shadow-dist
        cp julc-compiler/build/libs/julc-compiler-all-*-all.jar julc-vm-java/build/libs/julc-vm-java-all-*-all.jar shadow-dist/
        ls -la shadow-dist

    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: release-shadow-jars
        path: shadow-dist/*.jar
        if-no-files-found: error
        retention-days: 7

  github-release:
    needs: [validate, native-image, wasm, native-image-playground, shadow-jars]
    # Gated by github_release in gradle.properties. Runs only when every distribution was built, so a release
    # never ships with a platform missing; re-running a failed build job re-runs this one.
    if: needs.validate.outputs.github_release == 'true'
    runs-on: ubuntu-latest
    name: Create GitHub release
    permissions:
      contents: write
    steps:
    - name: Download release assets
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: dist
        merge-multiple: true

    - name: List release assets
      run: ls -la dist/

    # Creates the release for the tag, or adds the assets if it already exists. Do not pre-create a draft
    # release for the tag: the action publishes an existing draft.
    - name: Create GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: ${{ needs.validate.outputs.version }}
        files: dist/*
        fail_on_unmatched_files: true
        prerelease: ${{ needs.validate.outputs.is_final != 'true' }}
        # Latest is decided by semantic version and date, so a maintenance release (e.g. 0.1.3 after
        # 0.2.0) does not take the Latest badge.
        make_latest: legacy

  update-homebrew:
    needs: [validate, github-release]
    # Pushes a commit to bloxbean/homebrew-tap and downloads the release assets,
    # so it cannot run without a release: the formula URLs would 404 and the tap
    # would point at assets that do not exist.
    if: needs.validate.outputs.github_release == 'true'
    runs-on: ubuntu-latest
    name: Update Homebrew formulas
    # HOMEBREW_TAP_TOKEN is a secret of this environment, which only accepts v* tags (created by the release
    # App or an org admin), main and release/**. The job needs nothing from this repository's token.
    environment: release-staging
    permissions: {}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - name: Checkout homebrew-tap
      uses: actions/checkout@v4
      with:
        repository: bloxbean/homebrew-tap
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        # The token is only needed for the push below, which passes it explicitly.
        persist-credentials: false

    - name: Update julc formula
      shell: bash
      run: |
        set -euo pipefail

        # Download release assets
        curl -fSL -o macos.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-macos-aarch64.zip"
        curl -fSL -o linux.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-linux-x86_64.zip"
        curl -fSL -o linux-arm.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-linux-arm64.zip"

        MACOS_SHA=$(sha256sum macos.zip | awk '{print $1}')
        LINUX_SHA=$(sha256sum linux.zip | awk '{print $1}')
        LINUX_ARM_SHA=$(sha256sum linux-arm.zip | awk '{print $1}')

        mkdir -p Formula
        cat > Formula/julc.rb << FORMULA
        class Julc < Formula
          desc "JuLC Cardano smart contract toolkit"
          homepage "https://github.com/bloxbean/julc"
          version "${VERSION}"
          license "MIT"

          on_macos do
            if Hardware::CPU.arm?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-macos-aarch64.zip"
              sha256 "${MACOS_SHA}"
            end
          end

          on_linux do
            if Hardware::CPU.intel?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-linux-x86_64.zip"
              sha256 "${LINUX_SHA}"
            elsif Hardware::CPU.arm?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-${VERSION}-linux-arm64.zip"
              sha256 "${LINUX_ARM_SHA}"
            end
          end

          def install
            bin.install "julc"
          end

          test do
            assert_match version.to_s, shell_output("#{bin}/julc --version")
          end
        end
        FORMULA

        # Remove leading whitespace from heredoc (YAML run block adds 8 spaces)
        sed -i 's/^        //' Formula/julc.rb

    - name: Update julc-playground formula
      shell: bash
      run: |
        set -euo pipefail

        # Download playground release assets
        curl -fSL -o playground-macos.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-macos-aarch64.zip"
        curl -fSL -o playground-linux.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-linux-x86_64.zip"
        curl -fSL -o playground-linux-arm.zip \
          "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-linux-arm64.zip"

        PG_MACOS_SHA=$(sha256sum playground-macos.zip | awk '{print $1}')
        PG_LINUX_SHA=$(sha256sum playground-linux.zip | awk '{print $1}')
        PG_LINUX_ARM_SHA=$(sha256sum playground-linux-arm.zip | awk '{print $1}')

        mkdir -p Formula
        cat > Formula/julc-playground.rb << FORMULA
        class JulcPlayground < Formula
          desc "JuLC Playground - Web-based JRL editor and compiler"
          homepage "https://github.com/bloxbean/julc"
          version "${VERSION}"
          license "MIT"

          on_macos do
            if Hardware::CPU.arm?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-macos-aarch64.zip"
              sha256 "${PG_MACOS_SHA}"
            end
          end

          on_linux do
            if Hardware::CPU.intel?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-linux-x86_64.zip"
              sha256 "${PG_LINUX_SHA}"
            elsif Hardware::CPU.arm?
              url "https://github.com/bloxbean/julc/releases/download/v${VERSION}/julc-playground-${VERSION}-linux-arm64.zip"
              sha256 "${PG_LINUX_ARM_SHA}"
            end
          end

          def install
            bin.install "julc-playground"
          end

          test do
            # Start server in background, check health endpoint, then stop
            port = free_port
            pid = fork do
              ENV["JRL_PLAYGROUND_PORT"] = port.to_s
              exec bin/"julc-playground"
            end
            sleep 3
            begin
              output = shell_output("curl -s http://localhost:#{port}/api/health")
              assert_match "ok", output.downcase
            ensure
              Process.kill("TERM", pid)
              Process.wait(pid)
            end
          end
        end
        FORMULA

        # Remove leading whitespace from heredoc (YAML run block adds 8 spaces)
        sed -i 's/^        //' Formula/julc-playground.rb

    - name: Commit and push
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/julc.rb Formula/julc-playground.rb
        if git diff --cached --quiet; then
          echo "Formulas already at ${VERSION} - nothing to push."
          exit 0
        fi
        git commit -m "julc ${VERSION}"
        git remote set-url origin "https://x-access-token:${TAP_TOKEN}@github.com/bloxbean/homebrew-tap.git"
        git push
