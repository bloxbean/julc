plugins {
    id 'java-library'
}

description = 'Testing framework for unit-testing Plutus validators in JVM'

dependencies {
    api project(':julc-core')
    api project(':julc-vm')
    api project(':julc-compiler')
    api project(':julc-stdlib')
    api project(':julc-ledger-api')
    implementation "org.bouncycastle:bcprov-jdk18on:${bouncyCastleVersion}"
    testImplementation project(':julc-vm-java')
    testRuntimeOnly project(':julc-vm-scalus')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'JuLC Testkit'
                description = 'Testing Framework for JuLC Validators'
            }
        }
    }
}
