plugins {
    id 'java-library'
}

description = 'julc-tools - transport-neutral playground services shared by the server and the WebAssembly engine'

dependencies {
    api project(':julc-compiler')
    api project(':julc-core')
    api project(':julc-vm')
    implementation project(':julc-stdlib')
    implementation project(':julc-ledger-api')
    implementation project(':julc-vm-java')
    implementation project(':julc-testkit')
    implementation project(':julc-blueprint')

    // UPLC tools: decompiler, V1/V2 script contexts and bech32 addresses (cardano-client-lib)
    implementation project(':julc-decompiler')
    implementation project(':julc-cardano-client-lib')
    implementation "com.bloxbean.cardano:cardano-client-lib:${cardanoClientLibVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'

    // Model records carry Jackson annotations; (de)serialization happens in the transports
    api 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
}

rootProject.pinWebImageCardanoClientLib(project)

// ADR-068 M6: the equivalence gate, what a tool gives against the frozen baseline of 068/m6-tools-baseline.tsv:
//   ./gradlew :<module>:adr068Tools -Padr068.tools.sources=<dir>[:<dir>...] -Padr068.tools.baseline=<dir> [-Padr068.tools.out=<dir>] --offline
test {
    useJUnitPlatform {
        excludeTags 'adr068-tools'
    }
}

tasks.register('adr068Tools', Test) {
    group = 'verification'
    description = 'ADR-068 M6: this module\'s tools against their frozen baseline on a corpus'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'adr068-tools'
    }
    def sources = providers.gradleProperty('adr068.tools.sources')
    if (sources.present) systemProperty 'adr068.tools.sources', sources.get()
    def toolsBaseline = providers.gradleProperty('adr068.tools.baseline')
    if (toolsBaseline.present) systemProperty 'adr068.tools.baseline', toolsBaseline.get()
    systemProperty 'adr068.tools.out', providers.gradleProperty('adr068.tools.out')
            .map { rootProject.file(it).absolutePath }.orElse(layout.buildDirectory.dir('adr068-tools').get().asFile.absolutePath).get()
    outputs.upToDateWhen { false }
}
tasks.named('adr068Tools').configure { maxHeapSize = '3g' }
