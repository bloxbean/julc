# julc-bls loads native code in static initialisers: BlsOperations extracts libblst and binds FFM downcalls, and the
# blst-java SWIG classes load their JNI library. Both must run in the running image, not in the image builder,
# including for consumers such as Quarkus that initialise classes at build time by default.
Args = --initialize-at-run-time=org.julclang.bls.BlsOperations,supranational.blst
