import groovy.json.JsonSlurper

import java.security.MessageDigest

plugins {
    id 'java-library'
}

description = 'julc-wasm - GraalVM Web Image engine of the JuLC toolchain and VM, and the base for other languages\' images'

rootProject.pinWebImageCardanoClientLib(project)

// A language built on this module the way the README describes (ADR-064). It is not published: EmbeddingTest runs it
// on the JVM, and wasmSmokeEmbedder builds it into a Web Image from the jars an embedder gets.
sourceSets {
    embedderFixture {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    // ApiRegistry operations return julc-tools' ServiceResult, and VmApi takes its models: embedders compile against
    // them (ADR-064).
    api project(':julc-tools')
    implementation project(':julc-stdlib')
    implementation project(':julc-vm-java')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    // cardano-client-lib and the JSON schema validator log through SLF4J; stay silent in the browser console.
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'

    // Provided by GraalVM at image build time; never on the image class path.
    compileOnly 'org.graalvm.sdk:webimage-preview:25.3.4.1'
    compileOnly 'org.graalvm.nativeimage:svm:25.0.4.1'

    testImplementation project(':julc-playground')
    testImplementation 'io.javalin:javalin-testtools:6.7.0'
    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation sourceSets.embedderFixture.output
}

// --- WebAssembly image (opt-in: requires GraalVM with Web Image support and Binaryen on PATH) ---
//
//   ./gradlew :julc-wasm:wasmBundle -PgraalvmHome=/path/to/graalvm
//
// GraalVM resolution: -PgraalvmHome, then $GRAALVM_HOME.

def frontendWasmDir = project(':julc-playground').file('frontend/public/wasm')
def graalvmHome = providers.gradleProperty('graalvmHome').orElse(providers.environmentVariable('GRAALVM_HOME'))
// GraalVM release line the engine is built and released with (ADR-054). Web Image is preview technology whose
// output differs between release lines, so the build refuses any other line unless told otherwise:
//   ./gradlew :julc-wasm:wasmBundle -PwasmGraalvmVersion=25.0
def wasmGraalvmVersion = providers.gradleProperty('wasmGraalvmVersion').orElse('25.3')
def fileOps = project.services.get(FileSystemOperations)

// A GraalVM installation names its release line in <home>/release as GRAALVM_VERSION (for example 25.3.4.1).
// `native-image --version` reports the JDK version instead (25.0.4.1 for that same build), which cannot tell the
// 25.3 innovation line from the 25.0 LTS line.
def graalvmVersionOf = { File home ->
    def release = new File(home, 'release')
    def line = release.isFile() ? release.readLines('UTF-8').find { it.startsWith('GRAALVM_VERSION=') } : null
    if (line == null) {
        throw new GradleException("${home} is not a GraalVM installation: GRAALVM_VERSION not found in ${release}")
    }
    line.substring('GRAALVM_VERSION='.length()).replace('"', '').trim()
}

def resolveNativeImage = {
    if (!graalvmHome.isPresent()) {
        throw new GradleException('Set -PgraalvmHome=<GraalVM home> or GRAALVM_HOME to build the WebAssembly image.')
    }
    def home = new File(graalvmHome.get())
    def nativeImage = new File(home, 'bin/native-image')
    if (!nativeImage.canExecute()) {
        throw new GradleException("native-image not found at ${nativeImage}")
    }
    def expected = wasmGraalvmVersion.get()
    def actual = graalvmVersionOf(home)
    if (actual != expected && !actual.startsWith(expected + '.')) {
        def actualLine = actual.tokenize('.').take(2).join('.')
        throw new GradleException("The WebAssembly engine is built with GraalVM ${expected}, but ${home} is GraalVM "
                + "${actual}. Install GraalVM ${expected} with Web Image (see julc-playground/BUILD_FROM_SOURCE.md) "
                + "or pass -PwasmGraalvmVersion=${actualLine} to build with this installation anyway.")
    }
    nativeImage
}


// Lets the worker say where the module is (the launcher otherwise looks next to the page) and hear when main fails.
// The hook ships in the jar, so an image another language builds is patched with the same text (README, step 2).
def launcherHook = file('src/main/resources/META-INF/julc-wasm/launcher-hook.js')
def patchLauncher = { String launcher, String hook ->
    def anchor = 'const config = new GraalVM.Config();'
    if (launcher.count(anchor) != 1) throw new GradleException('Web Image launcher anchor changed')
    launcher.replace(anchor, anchor + '\n' + hook)
}

def versionResources = layout.buildDirectory.dir('version-resources')
tasks.register('wasmVersion') {
    inputs.property('version', project.version.toString())
    outputs.dir(versionResources)
    doLast {
        def dir = versionResources.get().asFile
        dir.mkdirs()
        new File(dir, 'julc-wasm-version.properties').text = "version=${project.version}\n"
    }
}
sourceSets.main.resources.srcDir(versionResources)
tasks.named('processResources') { dependsOn 'wasmVersion' }
// The published sources jar packs the resource directories too.
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'wasmVersion' }

// Strip full-toolchain reflection roots from the VM's copy of julc-tools. The
// per-variant metadata in julc-wasm explicitly registers its reachable API records.
tasks.register('vmToolsJar', Jar) {
    dependsOn ':julc-tools:classes'
    from project(':julc-tools').sourceSets.main.output
    exclude 'META-INF/native-image/**'
    archiveBaseName = 'julc-tools-vm'
    archiveClassifier = 'wasm'
}

['Full', 'Vm'].each { suffix ->
    def vmOnly = suffix == 'Vm'
    def variant = vmOnly ? 'vm' : 'full'
    def name = vmOnly ? 'julc-vm' : 'julc'
    def imageDir = layout.buildDirectory.dir("wasm-image-${variant}")
    def bundleDir = layout.buildDirectory.dir("wasm-bundle-${variant}")
    tasks.register("wasmImage${suffix}", Exec) {
        group = 'build'
        dependsOn 'jar', 'vmToolsJar'
        def cp = sourceSets.main.runtimeClasspath
        inputs.files(cp)
        inputs.file(tasks.named('jar').flatMap { it.archiveFile })
        inputs.property('graalvmHome', graalvmHome.orElse(''))
        inputs.property('graalvmVersion', wasmGraalvmVersion)
        outputs.dir(imageDir)
        doFirst {
            def dir = imageDir.get().asFile
            fileOps.delete { delete dir }
            dir.mkdirs()
            def files = cp.files.findAll { it.name.endsWith('.jar') }
            if (vmOnly) {
                files = files.findAll { f ->
                    ['julc-core-', 'julc-vm-', 'julc-bls-', 'cbor-', 'bcprov-', 'jackson-', 'slf4j-']
                            .any { f.name.startsWith(it) }
                }
                files += tasks.named('vmToolsJar').get().archiveFile.get().asFile
            }
            files = [tasks.named('jar').get().archiveFile.get().asFile] + files
            executable resolveNativeImage().absolutePath
            args '--tool:svm-wasm', '-cp', files.collect { it.absolutePath }.join(File.pathSeparator),
                    '-o', new File(dir, name).absolutePath, '-H:+ReportExceptionStackTraces',
                    '-H:+PrintAnalysisCallTree', '-H:PrintAnalysisCallTreeType=CSV'
            if (vmOnly) {
                ['com.bloxbean.cardano.*', 'org.julclang.compiler.*', 'org.julclang.decompiler.*',
                 'com.github.javaparser.*'].each { args "-H:AbortOnTypeReachable=${it}" }
            }
            args vmOnly ? 'org.julclang.wasm.JulcVmWasm' : 'org.julclang.wasm.JulcWasm'
        }
        doLast { fileOps.delete { delete new File(imageDir.get().asFile, "${name}.js.wat") } }
    }
    tasks.register("wasmBundle${suffix}") {
        group = 'build'
        dependsOn "wasmImage${suffix}", 'typeScriptDeclarations'
        inputs.dir(imageDir)
        inputs.file(launcherHook)
        inputs.dir('src/main/js')
        outputs.dir(bundleDir)
        doLast {
            def image = imageDir.get().asFile
            def bundle = bundleDir.get().asFile
            fileOps.delete { delete bundle }
            bundle.mkdirs()
            def launcher = patchLauncher(new File(image, "${name}.js").getText('UTF-8'), launcherHook.getText('UTF-8'))
            def moduleBytes = new File(image, "${name}.js.wasm").bytes
            def digest = MessageDigest.getInstance('SHA-256')
            digest.update(launcher.getBytes('UTF-8'))
            digest.update(moduleBytes)
            fileTree('src/main/js').files.sort { it.name }.each { digest.update(it.bytes) }
            digest.update(file('src/main/resources/julc-runtime.js').bytes)
            def groups = vmOnly ? ['vm', 'debug'] : ['vm', 'debug', 'compiler', 'uplc', 'sourceDebug', 'sourceDebugLocals']
            digest.update(variant.getBytes('UTF-8'))
            digest.update(groups.join(',').getBytes('UTF-8'))
            def hash = digest.digest().encodeHex().toString().substring(0, 12)
            new File(bundle, "${name}-${hash}.js").text = launcher
            new File(bundle, "${name}-${hash}.js.wasm").bytes = moduleBytes
            new File(bundle, 'engine.json').text = groovy.json.JsonOutput.toJson([
                    version: hash, launcher: "${name}-${hash}.js", variant: variant,
                    api: 0, groups: groups, julcVersion: project.version.toString()]) + '\n'
            fileOps.copy { from 'src/main/js'; into bundle }
            fileOps.copy { from layout.buildDirectory.dir('declarations'); into bundle }
            fileOps.copy { from 'src/main/resources/julc-runtime.js'; into bundle }
            if (!vmOnly) {
                fileOps.delete {
                    delete((frontendWasmDir.listFiles() ?: []).findAll {
                        it.name == 'engine.json' || it.name == 'julc-runtime.js' ||
                        it.name == 'julc-worker.js' || it.name == 'julc-wasm.js' ||
                        it.name == 'rest-adapter.js' || it.name.matches('julc(-playground)?-[0-9a-f]{12}\\.js(\\.wasm)?')
                    })
                }
                fileOps.copy { from bundle; into frontendWasmDir }
            }
            logger.lifecycle("${variant} image: ${moduleBytes.length} bytes; bundle ${bundle}")
        }
    }
    tasks.register("wasmSmoke${suffix}", Exec) {
        group = 'verification'
        dependsOn "wasmBundle${suffix}", 'wasmParityExpected', 'vmParityExpected', 'jsTest', ':julc-playground:exportCatalogue'
        outputs.upToDateWhen { false }
        executable 'node'
        doFirst {
            args '--experimental-wasm-exnref', file('src/test/js/wasm-smoke.mjs').absolutePath,
                    bundleDir.get().asFile.absolutePath, variant,
                    file('src/test/resources/parity-requests.json').absolutePath,
                    layout.buildDirectory.file('wasm-parity/expected.json').get().asFile.absolutePath,
                    new File(frontendWasmDir, 'catalogue.json').absolutePath,
                    layout.buildDirectory.file('wasm-parity/vm.json').get().asFile.absolutePath
        }
    }
}
// --- An image another language builds on julc-wasm (ADR-064) ---
//
// Built as the README tells an embedder to: from the julc-wasm jar and its runtime dependencies, with the metadata of
// the jars below excluded (the README gives the same pattern), patched with the launcher hook and served with the
// JavaScript client, both taken from the julc-wasm jar.
def EMBEDDER_EXCLUDED_METADATA_JARS =
        '.*[/\\\\](julc-tools|julc-blueprint|cardano-client-[a-z0-9-]+|json-schema-validator)-[0-9][^/\\\\]*\\.jar'
tasks.register('embedderFixtureJar', Jar) {
    from sourceSets.embedderFixture.output
    archiveBaseName = 'julc-wasm-demo'
    archiveClassifier = 'fixture'
}
def embedderImageDir = layout.buildDirectory.dir('wasm-image-embedder')
def embedderBundleDir = layout.buildDirectory.dir('wasm-bundle-embedder')
tasks.register('wasmImageEmbedder', Exec) {
    group = 'build'
    dependsOn 'jar', 'embedderFixtureJar'
    def cp = sourceSets.main.runtimeClasspath
    inputs.files(cp)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    inputs.file(tasks.named('embedderFixtureJar').flatMap { it.archiveFile })
    inputs.property('graalvmHome', graalvmHome.orElse(''))
    inputs.property('graalvmVersion', wasmGraalvmVersion)
    outputs.dir(embedderImageDir)
    doFirst {
        def dir = embedderImageDir.get().asFile
        fileOps.delete { delete dir }
        dir.mkdirs()
        def files = [tasks.named('jar').get().archiveFile.get().asFile,
                     tasks.named('embedderFixtureJar').get().archiveFile.get().asFile] +
                cp.files.findAll { it.name.endsWith('.jar') }
        executable resolveNativeImage().absolutePath
        args '--tool:svm-wasm', '-cp', files.collect { it.absolutePath }.join(File.pathSeparator),
                '-o', new File(dir, 'demo-lang').absolutePath, '-H:+ReportExceptionStackTraces',
                // native-image applies every jar's metadata, reachable or not. These jars' metadata registers JuLC's
                // compiler services, JavaParser and cardano-client-lib for JuLC's full image (19.1 MB instead of
                // 15.8 MB here); julc-wasm registers what VmApi needs itself (README).
                '--exclude-config', EMBEDDER_EXCLUDED_METADATA_JARS, 'META-INF/native-image/'
        // The demo language uses no JuLC compiler: the build fails if any of it, JavaParser or cardano-client-lib
        // becomes reachable, as JuLC's VM image does.
        ['com.bloxbean.cardano.*', 'org.julclang.compiler.*', 'org.julclang.decompiler.*',
         'com.github.javaparser.*'].each { args "-H:AbortOnTypeReachable=${it}" }
        args 'org.julclang.wasm.fixture.DemoLangWasm'
    }
    doLast { fileOps.delete { delete new File(embedderImageDir.get().asFile, 'demo-lang.js.wat') } }
}
tasks.register('wasmBundleEmbedder') {
    group = 'build'
    dependsOn 'wasmImageEmbedder'
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    inputs.dir(embedderImageDir)
    inputs.file(jarFile)
    outputs.dir(embedderBundleDir)
    doLast {
        def image = embedderImageDir.get().asFile
        def bundle = embedderBundleDir.get().asFile
        fileOps.delete { delete bundle }
        bundle.mkdirs()
        def hook = zipTree(jarFile.get().asFile).matching { include 'META-INF/julc-wasm/launcher-hook.js' }.singleFile
        def launcher = patchLauncher(new File(image, 'demo-lang.js').getText('UTF-8'), hook.getText('UTF-8'))
        def moduleBytes = new File(image, 'demo-lang.js.wasm').bytes
        def groups = ['vm', 'debug', 'demo']
        def digest = MessageDigest.getInstance('SHA-256')
        digest.update(launcher.getBytes('UTF-8'))
        digest.update(moduleBytes)
        digest.update(groups.join(',').getBytes('UTF-8'))
        def hash = digest.digest().encodeHex().toString().substring(0, 12)
        new File(bundle, "demo-lang-${hash}.js").text = launcher
        new File(bundle, "demo-lang-${hash}.js.wasm").bytes = moduleBytes
        new File(bundle, 'engine.json').text = groovy.json.JsonOutput.toJson([
                version: hash, launcher: "demo-lang-${hash}.js", variant: 'demo', api: 0, groups: groups,
                julcVersion: project.version.toString()]) + '\n'
        // README, step 4: the client comes from the julc-wasm jar, not from this module's sources.
        fileOps.copy {
            from(zipTree(jarFile.get().asFile)) { include 'META-INF/julc-wasm/js/**' }
            eachFile { it.path = it.name }
            includeEmptyDirs = false
            into bundle
        }
        logger.lifecycle("embedder image: ${moduleBytes.length} bytes; bundle ${bundle}")
    }
}
tasks.register('wasmSmokeEmbedder', Exec) {
    group = 'verification'
    dependsOn 'wasmBundleEmbedder', 'vmParityExpected'
    outputs.upToDateWhen { false }
    executable 'node'
    doFirst {
        args '--experimental-wasm-exnref', file('src/test/js/embedder-smoke.mjs').absolutePath,
                embedderBundleDir.get().asFile.absolutePath,
                layout.buildDirectory.file('wasm-parity/vm.json').get().asFile.absolutePath
    }
}
tasks.register('wasmBundle') { dependsOn 'wasmBundleFull', 'wasmBundleVm' }
tasks.register('wasmSmoke') { dependsOn 'wasmSmokeFull', 'wasmSmokeVm', 'wasmSmokeEmbedder' }
tasks.register('wasmParityExpected', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.julclang.wasm.ParityFixtures'
    args file('src/test/resources/parity-requests.json').absolutePath,
            layout.buildDirectory.file('wasm-parity/expected.json').get().asFile.absolutePath
    outputs.upToDateWhen { false }
}
tasks.register('jsTest', Exec) {
    group = 'verification'
    description = 'Run JavaScript codec and REST adapter tests (requires Node 22+).'
    commandLine 'node', '--test', 'src/test/js/codec.test.mjs', 'src/test/js/worker.test.mjs',
            'src/test/js/client.test.mjs'
}
tasks.register('vmParityExpected', JavaExec) {
    dependsOn 'testClasses', 'wasmParityExpected'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.julclang.wasm.VmParityFixtures'
    args rootProject.projectDir.absolutePath,
            layout.buildDirectory.file('wasm-parity/vm.json').get().asFile.absolutePath
    outputs.upToDateWhen { false }
}
tasks.named('test') { dependsOn 'jsTest' }
tasks.register('typeScriptDeclarations', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.julclang.wasm.TypeScriptDeclarations'
    args rootProject.projectDir.absolutePath,
            layout.buildDirectory.file('declarations/julc-models.d.ts').get().asFile.absolutePath
    inputs.dir(project(':julc-tools').file('src/main/java/org/julclang/tools/model'))
    outputs.dir(layout.buildDirectory.dir('declarations'))
}
tasks.named('test') { dependsOn 'typeScriptDeclarations' }

// The JavaScript client in the jar (ADR-064): an image another language builds on this module serves these files
// next to its launcher, so they always come from the same julc-wasm version as the image. julc-runtime.js, which
// JsApi loads, is an ordinary resource.
tasks.named('jar') {
    from('src/main/js') { into 'META-INF/julc-wasm/js' }
    from(tasks.named('typeScriptDeclarations')) { into 'META-INF/julc-wasm/js' }
}
