plugins {
    id 'java-library'
}

apply from: rootProject.file('gradle/jazzer-fuzz.gradle')

description = 'UPLC AST, PlutusData, and serialization (FLAT, CBOR)'

dependencies {
    api 'co.nstant.in:cbor:0.9'

    testImplementation libs.jazzer.junit
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'JuLC Core'
                description = 'UPLC AST and Serialization'
            }
        }
    }
}
