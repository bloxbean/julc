plugins {
    id 'java-library'
}

description = 'Plutus VM SPI interface and facade (pure Java, no Scala dependency)'

dependencies {
    api project(':julc-core')
    // BloxBean's fork; the same coordinates as cardano-client-lib.
    implementation 'com.bloxbean.cardano:net-i2p-crypto-eddsa:0.3.1'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'JuLC VM'
                description = 'Plutus VM SPI'
            }
        }
    }
}
