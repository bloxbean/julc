plugins {
    id 'java-library'
}

description = 'Plutus VM SPI interface and facade (pure Java, no Scala dependency)'

dependencies {
    api project(':julc-core')
    // Ed25519Equation runs on BouncyCastle's field arithmetic (X25519Field).
    implementation "org.bouncycastle:bcprov-jdk18on:${bouncyCastleVersion}"
    // BloxBean's i2p fork, the verifier before Ed25519Equation: a reference for the differential tests only.
    testImplementation 'com.bloxbean.cardano:net-i2p-crypto-eddsa:0.3.1'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'JuLC VM'
                description = 'Plutus VM SPI'
            }
        }
    }
}
