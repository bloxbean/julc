plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.2'
}

description = 'JMH benchmarks for julc VM backends'

// Exclude from publishing
tasks.withType(Javadoc).configureEach { enabled = false }

jmh {
    warmupIterations = 1
    iterations = 1
    warmup = '5s'
    timeOnIteration = '5s'
    fork = 1
    threads = 1
    resultFormat = 'CSV'

    // Filter: ./gradlew :julc-benchmark:jmh -PjmhInclude=CekTruffleBenchmark
    if (project.hasProperty('jmhInclude')) {
        includes = [project.property('jmhInclude')]
    }

    // Single file: ./gradlew :julc-benchmark:jmh -PjmhFile=escrow-redeem_1-1.flat
    if (project.hasProperty('jmhFile')) {
        benchmarkParameters = [file: [project.property('jmhFile')]]
    }

    // Disable Truffle JIT (interpreter-only mode):
    //   ./gradlew :julc-benchmark:jmh -PnoJit
    if (project.hasProperty('noJit')) {
        jvmArgsAppend = ['-Dtruffle.TruffleRuntime=com.oracle.truffle.api.impl.DefaultTruffleRuntime']
    }
}

tasks.register('optimizationEvidence', JavaExec) {
    group = 'verification'
    description = 'Run ADR-032 semantic/cost fixtures and print release-note Markdown'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.bloxbean.cardano.julc.benchmark.optimization.OptimizationEvidenceMain'
}

dependencies {
    implementation project(':julc-compiler')
    implementation project(':julc-stdlib')
    implementation project(':julc-cardano-client-lib')
    implementation project(':julc-vm')
    implementation project(':julc-vm-java')
    implementation project(':julc-vm-truffle')

    jmh project(':julc-core')
    jmh project(':julc-vm')
    jmh project(':julc-vm-java')
    jmh project(':julc-vm-truffle')
}

tasks.register('listCaseEvidence', JavaExec) {
    group = 'verification'
    description = 'Run ADR-034 compiled for-each semantic/cost fixtures'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.bloxbean.cardano.julc.benchmark.optimization.ListCaseEvidence'
}
